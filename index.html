<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TRIPIC | 트립픽 - 감성 여행 일정 & 실시간 동행 플래너</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-cream: #F8F7F3;
      --bg-card: #FFFFFF;
      --primary-green: #315C4C;
      --primary-green-dark: #234438;
      --sage-light: #E7EEE8;
      --sage-mid: #D2E0D5;
      --text-main: #1F2A24;
      --text-sub: #66756D;
      --border-soft: #E3E6DF;
      --danger: #D94E4E;
      --shadow-sm: 0 2px 10px rgba(31, 42, 36, 0.05);
      --shadow-md: 0 8px 24px rgba(31, 42, 36, 0.08);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Noto Sans KR', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #EFECE6;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: var(--bg-cream);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.07);
      overflow-x: hidden;
    }

    /* Splash Screen */
    .splash-screen {
      position: fixed;
      inset: 0;
      max-width: 480px;
      margin: 0 auto;
      background: linear-gradient(165deg, #315C4C 0%, #234438 100%);
      color: #F8F7F3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }
    .splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-logo {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 0.14em;
      margin-bottom: 10px;
    }
    .splash-sub {
      font-size: 13px;
      color: #D2E0D5;
      letter-spacing: 0.04em;
    }

    /* Top Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(248, 247, 243, 0.92);
      backdrop-filter: blur(10px);
      padding: 16px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-soft);
    }
    .brand-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: var(--primary-green);
      letter-spacing: 0.06em;
    }
    .brand-badge {
      font-size: 11px;
      font-weight: 600;
      background: var(--sage-light);
      color: var(--primary-green);
      padding: 3px 8px;
      border-radius: 999px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }
    .user-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary-green);
    }
    .bell-btn {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--primary-green);
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease;
    }
    .bell-btn:active {
      transform: scale(0.94);
    }
    .bell-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--danger);
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg-cream);
    }
    .bell-badge.visible {
      display: flex;
    }

    /* Invite Slide Banner */
    .invite-toast-banner {
      display: none;
      margin: 12px 16px 0;
      background: var(--primary-green);
      color: #F8F7F3;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      animation: slideDown 0.25s ease;
    }
    .invite-toast-banner.visible {
      display: flex;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .invite-toast-text {
      font-size: 12.5px;
      line-height: 1.4;
    }
    .invite-toast-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 16px 18px 96px;
    }
    .tab-view {
      display: none;
    }
    .tab-view.active {
      display: block;
    }

    /* Cards & Typography */
    .section-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }
    .card-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }
    .card-sub {
      font-size: 12.5px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* Buttons */
    .btn {
      border: none;
      border-radius: var(--radius-sm);
      padding: 11px 16px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background: var(--primary-green);
      color: #FFFFFF;
    }
    .btn-primary:hover {
      background: var(--primary-green-dark);
    }
    .btn-sage {
      background: var(--sage-light);
      color: var(--primary-green);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-soft);
      color: var(--text-main);
    }
    .btn-danger {
      background: #FDECEC;
      color: var(--danger);
    }
    .btn-sm {
      padding: 7px 11px;
      font-size: 12px;
      border-radius: 8px;
    }
    .btn-block {
      width: 100%;
    }

    /* Form Controls */
    .form-group {
      margin-bottom: 14px;
      position: relative;
    }
    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 6px;
    }
    .form-input, .form-select {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-soft);
      background: var(--bg-cream);
      font-size: 14px;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .form-input:focus, .form-select:focus {
      border-color: var(--primary-green);
      background: #FFFFFF;
    }

    /* Autocomplete Dropdown */
    .autocomplete-list {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      background: #FFFFFF;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
      z-index: 80;
      max-height: 210px;
      overflow-y: auto;
      display: none;
    }
    .autocomplete-list.visible {
      display: block;
    }
    .autocomplete-item {
      padding: 10px 14px;
      border-bottom: 1px solid #F1F3EE;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .autocomplete-item:last-child {
      border-bottom: none;
    }
    .autocomplete-item:hover {
      background: var(--sage-light);
    }
    .ac-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
    }
    .ac-meta {
      font-size: 11.5px;
      color: var(--text-sub);
    }

    /* Range Date Picker */
    .range-summary-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-cream);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      cursor: pointer;
    }
    .range-dates {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      font-weight: 600;
    }
    .range-nights-badge {
      background: var(--sage-light);
      color: var(--primary-green);
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
    }
    .range-calendar-panel {
      display: none;
      margin-top: 8px;
      background: #FFFFFF;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 14px;
      box-shadow: var(--shadow-md);
    }
    .range-calendar-panel.open {
      display: block;
    }
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .cal-month-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }
    .cal-weekdays, .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      gap: 3px;
    }
    .cal-weekdays span {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
      padding: 4px 0;
    }
    .cal-day {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-main);
    }
    .cal-day:hover:not(.empty) {
      background: var(--sage-light);
    }
    .cal-day.in-range {
      background: var(--sage-light);
      color: var(--primary-green);
      font-weight: 600;
      border-radius: 0;
    }
    .cal-day.selected-start, .cal-day.selected-end {
      background: var(--primary-green) !important;
      color: #FFFFFF !important;
      font-weight: 700;
      border-radius: 8px;
    }

    /* Trip Selector & Day Tabs */
    .trip-hero {
      background: linear-gradient(145deg, #315C4C 0%, #26493C 100%);
      color: #F8F7F3;
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-md);
    }
    .trip-hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .trip-hero-city {
      font-size: 12px;
      color: #D2E0D5;
      font-weight: 600;
    }
    .trip-hero-title {
      font-size: 20px;
      font-weight: 700;
      margin: 4px 0 6px;
    }
    .trip-hero-meta {
      font-size: 12px;
      color: #E7EEE8;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .collab-bar {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      gap: 8px;
    }
    .member-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .member-chip {
      background: rgba(255, 255, 255, 0.16);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
    }
    .day-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }
    .day-pill {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      white-space: nowrap;
    }
    .day-pill.active {
      background: var(--primary-green);
      color: #FFFFFF;
      border-color: var(--primary-green);
    }

    /* Timeline Stops */
    .stop-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      box-shadow: var(--shadow-sm);
    }
    .stop-order {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--sage-light);
      color: var(--primary-green);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .stop-body {
      flex: 1;
      min-width: 0;
    }
    .stop-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .stop-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }
    .stop-cat {
      font-size: 11px;
      font-weight: 600;
      background: var(--sage-light);
      color: var(--primary-green);
      padding: 2px 7px;
      border-radius: 6px;
    }
    .stop-addr {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 3px;
    }
    .stop-memo {
      font-size: 12.5px;
      color: var(--text-main);
      background: var(--bg-cream);
      padding: 7px 10px;
      border-radius: 8px;
      margin-top: 8px;
    }
    .stop-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    /* Map Route View */
    .route-visual {
      background: var(--sage-light);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 12px;
    }
    .route-step {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px dashed var(--sage-mid);
    }
    .route-step:last-child {
      border-bottom: none;
    }

    /* Modals & Drawers */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      max-width: 480px;
      margin: 0 auto;
      background: rgba(24, 32, 28, 0.45);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-sheet {
      width: 100%;
      background: var(--bg-card);
      border-radius: 24px 24px 0 0;
      padding: 20px 20px 28px;
      max-height: 86vh;
      overflow-y: auto;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.14);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 700;
    }

    /* Notification Item */
    .notif-item {
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-soft);
      margin-bottom: 8px;
      background: var(--bg-cream);
    }
    .notif-item.unread {
      background: var(--sage-light);
      border-color: var(--sage-mid);
    }

    /* Status Pill */
    .status-box {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: var(--sage-light);
      color: var(--primary-green);
      font-size: 12.5px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border-soft);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 6px 14px;
      z-index: 60;
    }
    .nav-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      font-family: inherit;
    }
    .nav-btn.active {
      color: var(--primary-green);
    }
    .nav-icon {
      font-size: 18px;
      line-height: 1;
    }

    /* Toast */
    .toast-msg {
      position: fixed;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      background: #1F2A24;
      color: #FFFFFF;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 500;
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      white-space: nowrap;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast-msg.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Splash Screen -->
    <div id="splashScreen" class="splash-screen">
      <div class="splash-logo">TRIPIC</div>
      <div class="splash-sub">함께 완성하는 감성 여행 루트 플래너</div>
    </div>

    <!-- Top Header -->
    <header class="top-header">
      <div>
        <span class="brand-title">TRIPIC</span>
        <span class="brand-badge">트립픽</span>
      </div>
      <div class="header-actions">
        <button type="button" class="user-pill" onclick="switchTab('account')">
          <span class="user-dot"></span>
          <span id="headerUserLabel">게스트</span>
        </button>
        <button type="button" class="bell-btn" aria-label="알림 센터" onclick="openNotifModal()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span id="bellBadge" class="bell-badge">0</span>
        </button>
      </div>
    </header>

    <!-- Live Invite Alert Banner -->
    <div id="inviteToastBanner" class="invite-toast-banner">
      <div class="invite-toast-text" id="inviteToastText">새 동행 초대가 도착했습니다.</div>
      <div class="invite-toast-actions">
        <button type="button" class="btn btn-sm" style="background:#FFFFFF;color:#315C4C;" onclick="openNotifModal()">확인</button>
        <button type="button" class="btn btn-sm" style="background:rgba(255,255,255,0.2);color:#FFFFFF;" onclick="dismissInviteBanner()">닫기</button>
      </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
      <!-- TAB 1: 내 일정 -->
      <section id="tab-itinerary" class="tab-view active">
        <div id="tripSwitcherWrap" style="margin-bottom:10px; display:none;">
          <select id="tripSelector" class="form-select" onchange="selectTrip(this.value)"></select>
        </div>

        <div id="itineraryContent"></div>
      </section>

      <!-- TAB 2: 새 여행 -->
      <section id="tab-create" class="tab-view">
        <div class="section-card">
          <div class="card-title-row">
            <div>
              <div class="card-title">새 여행 일정 만들기</div>
              <div class="card-sub">여행지를 먼저 고르고 기간을 선택해 루트를 시작하세요</div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="createCityInput">여행지 (필수)</label>
            <input type="text" id="createCityInput" class="form-input" placeholder="예: 서울, 제주, 부산, 강릉, 경주, 도쿄, 오사카" autocomplete="off" oninput="handleCityInput(this.value)" onfocus="handleCityInput(this.value)" />
            <div id="cityAutocomplete" class="autocomplete-list"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="createTitleInput">여행 제목</label>

    function formatDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function parseDate(str) {
      const [y, m, d] = str.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function addDays(str, delta) {
      const dt = parseDate(str);
      dt.setDate(dt.getDate() + delta);
      return formatDate(dt);
    }

    function diffDays(startStr, endStr) {
      const ms = parseDate(endStr) - parseDate(startStr);
      return Math.round(ms / 86400000);
    }

    /* =========================================================
       3. Supabase Direct REST API Client
       ========================================================= */
    async function sbRequest(path, options = {}) {
      const headers = {
        "apikey": SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        ...(options.headers || {})
      };
      if (!SUPABASE_ANON_KEY.startsWith("sb_publishable_")) {
        headers["Authorization"] = `Bearer ${SUPABASE_ANON_KEY}`;
      }
      const res = await fetch(`${SUPABASE_REST_URL}${path}`, {
        ...options,
        headers
      });
      const text = await res.text();
      let data = null;
      try {
        data = text ? JSON.parse(text) : null;
      } catch (e) {
        data = text;
      }
      if (!res.ok) {
        const msg = (data && data.message) ? data.message : `HTTP ${res.status}`;
        throw new Error(`HTTP ${res.status}: ${msg}`);
      }
      return data;
    }

    async function syncWithSupabase(manual = false) {
      try {
        await sbRequest("/tripic_users?select=user_id&limit=1");
        syncStatus = {
          ok: true,
          label: "Supabase 클라우드 실시간 연동됨",
          detail: "회원·일정·초대 알림이 정상적으로 동기화되고 있습니다."
        };

        if (currentUser) {
          // Pull user's own or invited trips
          const allTrips = await sbRequest("/tripic_trips?select=*");
          if (Array.isArray(allTrips)) {
            const myTrips = allTrips.filter(row => {
              const mIds = Array.isArray(row.member_ids) ? row.member_ids : [];
              return row.owner_id === currentUser.user_id || mIds.includes(currentUser.user_id);
            });

            myTrips.forEach(remote => {
              const localIdx = appState.trips.findIndex(t => t.id === remote.id);
              const mapped = {
                id: remote.id,
                ownerId: remote.owner_id,
                memberIds: Array.isArray(remote.member_ids) ? remote.member_ids : [remote.owner_id],
                members: Array.isArray(remote.members) ? remote.members : [],
                title: remote.title,
                city: remote.city,
                startDate: remote.start_date,
                endDate: remote.end_date,
                people: remote.people || "2명 (커플/친구)",
                days: remote.days || {},
                lastEditor: remote.last_editor || "",
                updatedAt: remote.updated_at || new Date().toISOString()
              };

              if (localIdx === -1) {
                appState.trips.push(mapped);
              } else {
                const localTime = new Date(appState.trips[localIdx].updatedAt || 0).getTime();
                const remoteTime = new Date(mapped.updatedAt || 0).getTime();
                if (remoteTime > localTime) {
                  appState.trips[localIdx] = mapped;
                }
              }
            });
          }

          // Pull notifications addressed to current user
          const notifs = await sbRequest(`/tripic_notifications?to_code=eq.${encodeURIComponent(currentUser.code)}&order=created_at.desc`);
          if (Array.isArray(notifs)) {
            const prevUnread = appState.notifications.filter(n => !n.is_read).length;
            appState.notifications = notifs;
            const nextUnread = notifs.filter(n => !n.is_read).length;
            if (nextUnread > prevUnread) {
              const newest = notifs.find(n => !n.is_read);
              if (newest) showInviteBanner(`${newest.from_name}님이 '${newest.trip_title}' 일정에 초대했습니다.`);
            }
          }

          saveLocalState();
          renderAll();
        }

        if (manual) showToast("클라우드 동기화가 완료되었습니다.");
      } catch (err) {
        syncStatus = {
          ok: false,
          label: "클라우드 동기화 점검 필요",
          detail: `진단: ${err.message}`
        };
        if (manual) showToast(`동기화 오류: ${err.message}`);
      }
      if (document.getElementById("tab-account").classList.contains("active")) {
        renderAccountTab();
      }
    }

    async function pushTripToSupabase(trip) {
      if (!currentUser) return;
      try {
        await sbRequest("/tripic_trips", {
          method: "POST",
          headers: { "Prefer": "resolution=merge-duplicates" },
          body: JSON.stringify({
            id: trip.id,
            owner_id: trip.ownerId,
            member_ids: trip.memberIds,
            members: trip.members,
            title: trip.title,
            city: trip.city,
            start_date: trip.startDate,
            end_date: trip.endDate,
            people: trip.people,
            days: trip.days,
            last_editor: currentUser.nickname,
            updated_at: trip.updatedAt
          })
        });
      } catch (e) {}
    }

    /* =========================================================
       4. Permission & Trip Helpers
       ========================================================= */
    function getActiveTrip() {
      return appState.trips.find(t => t.id === appState.activeTripId) || appState.trips[0] || null;
    }

    function canEditTrip(trip) {
      if (!trip) return false;
      const uid = currentUser ? currentUser.user_id : "guest";
      if (trip.ownerId === uid) return true;
      return Array.isArray(trip.memberIds) && trip.memberIds.includes(uid);
    }

    function selectTrip(tripId) {
      appState.activeTripId = tripId;
      appState.activeDay = 1;
      saveLocalState();
      renderAll();
    }

    /* =========================================================
       5. Navigation & Range Date Picker
       ========================================================= */
    function switchTab(tabName) {
      document.querySelectorAll(".tab-view").forEach(v => v.classList.remove("active"));
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      const target = document.getElementById(`tab-${tabName}`);
      if (target) target.classList.add("active");
      const btn = document.querySelector(`.nav-btn[data-tab="${tabName}"]`);
      if (btn) btn.classList.add("active");

      if (tabName === "create") {
        resetCreateForm();
      } else if (tabName === "map") {
        renderMapTab();
      } else if (tabName === "account") {
        renderAccountTab();
      } else {
        renderItineraryTab();
      }
    }

    function resetCreateForm() {
      document.getElementById("createCityInput").value = "";
      document.getElementById("createTitleInput").value = "";
      document.getElementById("cityAutocomplete").classList.remove("visible");
      const today = formatDate(new Date());
      rangeStart = today;
      rangeEnd = addDays(today, 1);
      const d = parseDate(rangeStart);
      calYear = d.getFullYear();
      calMonth = d.getMonth();
      updateRangeSummaryUI();
      renderRangeCalendar();
    }

    function updateRangeSummaryUI() {
      document.getElementById("rangeStartLabel").textContent = rangeStart;
      document.getElementById("rangeEndLabel").textContent = rangeEnd;
      const nights = diffDays(rangeStart, rangeEnd);
      document.getElementById("rangeNightsBadge").textContent = nights === 0 ? "당일치기" : `${nights}박 ${nights + 1}일`;
    }

    function toggleRangeCalendar() {
      const panel = document.getElementById("rangeCalendarPanel");
      panel.classList.toggle("open");
      if (panel.classList.contains("open")) renderRangeCalendar();
    }

    function changeCalMonth(delta) {
      calMonth += delta;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      if (calMonth > 11) { calMonth = 0; calYear++; }
      renderRangeCalendar();
    }

    function renderRangeCalendar() {
      document.getElementById("calMonthLabel").textContent = `${calYear}년 ${calMonth + 1}월`;
      const grid = document.getElementById("calDaysGrid");
      grid.innerHTML = "";

      const firstDay = new Date(calYear, calMonth, 1).getDay();
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "cal-day empty";
        grid.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const cell = document.createElement("div");
        cell.className = "cal-day";
        cell.textContent = day;

        if (dateStr === rangeStart) cell.classList.add("selected-start");
        else if (dateStr === rangeEnd) cell.classList.add("selected-end");
        else if (rangeStart && rangeEnd && dateStr > rangeStart && dateStr < rangeEnd) {
          cell.classList.add("in-range");
        }

        cell.onclick = () => onSelectCalDate(dateStr);
        grid.appendChild(cell);
      }
    }

    let selectingSecond = false;
    function onSelectCalDate(dateStr) {
      if (!selectingSecond) {
        rangeStart = dateStr;
        rangeEnd = dateStr;
        selectingSecond = true;
      } else {
        if (dateStr < rangeStart) {
          rangeEnd = rangeStart;
          rangeStart = dateStr;
        } else {
          rangeEnd = dateStr;
        }
        if (diffDays(rangeStart, rangeEnd) > 9) {
          rangeEnd = addDays(rangeStart, 9);
          showToast("일정은 최대 10일(9박 10일)까지 선택할 수 있습니다.");
        }
        selectingSecond = false;
      }
      updateRangeSummaryUI();
      renderRangeCalendar();
    }

    /* =========================================================
       6. Autocomplete (Destination & Place)
       ========================================================= */
    function normalizeRegionName(input) {
      const trimmed = input.trim();
      if (!trimmed) return "";
      const exact = REGION_CATALOG.find(r => r.short === trimmed || r.full === trimmed || r.full.includes(trimmed));
      return exact ? exact.full : trimmed;
    }

    function handleCityInput(val) {
      const box = document.getElementById("cityAutocomplete");
      const q = val.trim().toLowerCase();
      const matches = REGION_CATALOG.filter(r =>
        !q || r.short.toLowerCase().includes(q) || r.full.toLowerCase().includes(q) || r.desc.toLowerCase().includes(q)
      );
      if (matches.length === 0) {
        box.classList.remove("visible");
        return;
      }
      box.innerHTML = matches.map(r => `
        <div class="autocomplete-item" onclick="pickRegion('${r.full}')">
          <span class="ac-name">${r.full}</span>
          <span class="ac-meta">${r.desc}</span>
        </div>
      `).join("");
      box.classList.add("visible");
    }

    function pickRegion(fullName) {
      document.getElementById("createCityInput").value = fullName;
      document.getElementById("cityAutocomplete").classList.remove("visible");
      const titleInput = document.getElementById("createTitleInput");
      if (!titleInput.value.trim()) {
        titleInput.value = `${fullName} 감성 여행 루트`;
      }
    }

    function handlePlaceSearchInput(val) {
      const box = document.getElementById("placeAutocomplete");
      const trip = getActiveTrip();
      const targetCity = trip ? trip.city : "";
      const q = val.trim().toLowerCase();

      const sorted = [...PLACE_CATALOG].sort((a, b) => {
        const aMatch = targetCity && a.city.includes(targetCity) ? 0 : 1;
        const bMatch = targetCity && b.city.includes(targetCity) ? 0 : 1;
        return aMatch - bMatch;
      });

      const filtered = sorted.filter(p =>
        !q || p.name.toLowerCase().includes(q) || p.addr.toLowerCase().includes(q) || p.city.toLowerCase().includes(q)
      ).slice(0, 8);

      if (filtered.length === 0) {
        box.classList.remove("visible");
        return;
      }

      box.innerHTML = filtered.map(p => `
        <div class="autocomplete-item" onclick="pickPlace('${p.name.replace(/'/g, "\'")}', '${p.addr.replace(/'/g, "\'")}', '${p.cat}')">
          <span class="ac-name">${p.name} <small style="color:var(--primary-green);">(${p.cat})</small></span>
          <span class="ac-meta">${p.addr}</span>
        </div>
      `).join("");
      box.classList.add("visible");
    }

    function pickPlace(name, addr, cat) {
      document.getElementById("stopSearchInput").value = name;
      document.getElementById("stopAddressInput").value = addr;
      document.getElementById("stopCategorySelect").value = cat;
      document.getElementById("placeAutocomplete").classList.remove("visible");
    }

    /* =========================================================
       7. Create Trip & Edit Stops
       ========================================================= */
    async function createNewTrip() {
      const rawCity = document.getElementById("createCityInput").value;
      const city = normalizeRegionName(rawCity);
      if (!city) {
        showToast("여행지를 먼저 입력하거나 선택해 주세요.");
        return;
      }
      const title = document.getElementById("createTitleInput").value.trim() || `${city} 여행 일정`;
      const people = document.getElementById("createPeopleSelect").value;
      const totalDays = diffDays(rangeStart, rangeEnd) + 1;

      const daysObj = {};
      for (let i = 1; i <= totalDays; i++) {
        daysObj[i] = [];
      }

      const ownerId = currentUser ? currentUser.user_id : "guest";
      const ownerName = currentUser ? currentUser.nickname : "게스트";

      const newTrip = {
        id: "trip_" + Date.now(),
        ownerId,
        memberIds: [ownerId],
        members: [{ userId: ownerId, nickname: ownerName, role: "방장" }],
        title,
        city,
        startDate: rangeStart,
        endDate: rangeEnd,
        people,
        days: daysObj,
        lastEditor: ownerName,
        updatedAt: new Date().toISOString()
      };

      appState.trips.unshift(newTrip);
      appState.activeTripId = newTrip.id;
      appState.activeDay = 1;
      saveLocalState();
      await pushTripToSupabase(newTrip);

      showToast(`'${title}' 일정이 생성되었습니다!`);
      switchTab("itinerary");
    }

    function openStopModal(index = null) {
      const trip = getActiveTrip();
      if (!trip) return;
      if (!canEditTrip(trip)) {
        showToast("초대된 동행자만 일정을 편집할 수 있습니다.");
        return;
      }

      editingStopIndex = index;
      document.getElementById("stopCityHint").textContent = trip.city;
      document.getElementById("placeAutocomplete").classList.remove("visible");

      if (index !== null) {
        const stop = (trip.days[appState.activeDay] || [])[index];
        document.getElementById("stopModalTitle").textContent = "장소 수정";
        document.getElementById("stopSearchInput").value = stop.name || "";
        document.getElementById("stopAddressInput").value = stop.addr || "";
        document.getElementById("stopTimeInput").value = stop.time || "10:30";
        document.getElementById("stopCategorySelect").value = stop.cat || "명소";
        document.getElementById("stopMemoInput").value = stop.memo || "";
      } else {
        document.getElementById("stopModalTitle").textContent = `Day ${appState.activeDay} 장소 추가`;
        document.getElementById("stopSearchInput").value = "";
        document.getElementById("stopAddressInput").value = "";
        document.getElementById("stopTimeInput").value = "11:00";
        document.getElementById("stopCategorySelect").value = "명소";
        document.getElementById("stopMemoInput").value = "";
      }

      document.getElementById("stopModal").classList.add("open");
    }

    function closeStopModal() {
      document.getElementById("stopModal").classList.remove("open");
    }

    async function saveStopFromModal() {
      const trip = getActiveTrip();
      if (!trip || !canEditTrip(trip)) return;

      const name = document.getElementById("stopSearchInput").value.trim();
      if (!name) {
        showToast("장소명을 입력해 주세요.");
        return;
      }

      const stopData = {
        name,
        addr: document.getElementById("stopAddressInput").value.trim() || trip.city,
        time: document.getElementById("stopTimeInput").value || "10:00",
        cat: document.getElementById("stopCategorySelect").value,
        memo: document.getElementById("stopMemoInput").value.trim()
      };

      if (!trip.days[appState.activeDay]) trip.days[appState.activeDay] = [];

      if (editingStopIndex !== null) {
        trip.days[appState.activeDay][editingStopIndex] = stopData;
      } else {
        trip.days[appState.activeDay].push(stopData);
      }

      trip.updatedAt = new Date().toISOString();
      trip.lastEditor = currentUser ? currentUser.nickname : "게스트";

      saveLocalState();
      closeStopModal();
      renderItineraryTab();
      await pushTripToSupabase(trip);
      showToast("일정이 저장되었습니다.");
    }

    async function removeStop(index) {
      const trip = getActiveTrip();
      if (!trip || !canEditTrip(trip)) return;
      trip.days[appState.activeDay].splice(index, 1);
      trip.updatedAt = new Date().toISOString();
      saveLocalState();
      renderItineraryTab();
      await pushTripToSupabase(trip);
      showToast("장소가 삭제되었습니다.");
    }

    async function moveStop(index, dir) {
      const trip = getActiveTrip();
      if (!trip || !canEditTrip(trip)) return;
      const list = trip.days[appState.activeDay];
      const target = index + dir;
      if (target < 0 || target >= list.length) return;
      [list[index], list[target]] = [list[target], list[index]];
      trip.updatedAt = new Date().toISOString();
      saveLocalState();
      renderItineraryTab();
      await pushTripToSupabase(trip);
    }

    /* =========================================================
       8. Friend Invite & Notification Center
       ========================================================= */
    function openInviteModal() {
      if (!currentUser) {
        showToast("친구 초대를 위해 먼저 내 계정 탭에서 로그인해 주세요.");
        switchTab("account");
        return;
      }
      document.getElementById("inviteCodeInput").value = "";
      document.getElementById("inviteModal").classList.add("open");
    }

    function closeInviteModal() {
      document.getElementById("inviteModal").classList.remove("open");
    }

    async function sendTripInvite() {
      const code = document.getElementById("inviteCodeInput").value.trim().toUpperCase();
      if (code.length < 4) {
        showToast("4자리 친구 초대코드를 입력해 주세요.");
        return;
      }
      if (currentUser && code === currentUser.code) {
        showToast("본인 초대코드는 입력할 수 없습니다.");
        return;
      }

      const trip = getActiveTrip();
      if (!trip) return;

      try {
        const users = await sbRequest(`/tripic_users?code=eq.${encodeURIComponent(code)}`);
        if (!Array.isArray(users) || users.length === 0) {
          showToast("해당 초대코드의 회원을 찾을 수 없습니다.");
          return;
        }
        const targetUser = users[0];
        const notifPayload = {
          id: "notif_" + Date.now(),
          to_user_id: targetUser.user_id,
          to_code: targetUser.code,
          from_user_id: currentUser.user_id,
          from_name: currentUser.nickname,
          trip_id: trip.id,
          trip_title: trip.title,
          trip_snapshot: trip,
          status: "pending",
          is_read: false,
          created_at: new Date().toISOString()
        };

        await sbRequest("/tripic_notifications", {
          method: "POST",
          body: JSON.stringify(notifPayload)
        });

        closeInviteModal();
        showToast(`${targetUser.nickname}님에게 동행 초대를 보냈습니다!`);
      } catch (e) {
        showToast(`초대 전송 실패: ${e.message}`);
      }
    }

    function showInviteBanner(text) {
      document.getElementById("inviteToastText").textContent = text;
      document.getElementById("inviteToastBanner").classList.add("visible");
    }

    function dismissInviteBanner() {
      document.getElementById("inviteToastBanner").classList.remove("visible");
    }

    function openNotifModal() {
      dismissInviteBanner();
      renderNotificationList();
      document.getElementById("notifModal").classList.add("open");
    }

    function closeNotifModal() {
      document.getElementById("notifModal").classList.remove("open");
    }

    async function respondInvite(notifId, accept) {
      const notif = appState.notifications.find(n => n.id === notifId);
      if (!notif) return;

      notif.status = accept ? "accepted" : "declined";
      notif.is_read = true;

      try {
        await sbRequest(`/tripic_notifications?id=eq.${encodeURIComponent(notifId)}`, {
          method: "PATCH",
          body: JSON.stringify({ status: notif.status, is_read: true })
        });

        if (accept && currentUser) {
          const remoteTrips = await sbRequest(`/tripic_trips?id=eq.${encodeURIComponent(notif.trip_id)}`);
          const baseTrip = (Array.isArray(remoteTrips) && remoteTrips[0]) ? remoteTrips[0] : notif.trip_snapshot;

          if (baseTrip) {
            const memberIds = Array.isArray(baseTrip.member_ids || baseTrip.memberIds)
              ? [...(baseTrip.member_ids || baseTrip.memberIds)]
              : [baseTrip.owner_id || baseTrip.ownerId];
            if (!memberIds.includes(currentUser.user_id)) {
              memberIds.push(currentUser.user_id);
            }

            const members = Array.isArray(baseTrip.members) ? [...baseTrip.members] : [];
            if (!members.some(m => m.userId === currentUser.user_id)) {
              members.push({ userId: currentUser.user_id, nickname: currentUser.nickname, role: "동행 편집자" });
            }

            const joinedTrip = {
              id: baseTrip.id,
              ownerId: baseTrip.owner_id || baseTrip.ownerId,
              memberIds,
              members,
              title: baseTrip.title,
              city: baseTrip.city,
              startDate: baseTrip.start_date || baseTrip.startDate,
              endDate: baseTrip.end_date || baseTrip.endDate,
              people: baseTrip.people || "2명 (커플/친구)",
              days: baseTrip.days || {},
              lastEditor: currentUser.nickname,
              updatedAt: new Date().toISOString()
            };

            const existingIdx = appState.trips.findIndex(t => t.id === joinedTrip.id);
            if (existingIdx >= 0) appState.trips[existingIdx] = joinedTrip;
            else appState.trips.unshift(joinedTrip);

            appState.activeTripId = joinedTrip.id;
            await pushTripToSupabase(joinedTrip);
            showToast(`'${joinedTrip.title}' 일정에 합류했습니다!`);
          }
        } else {
          showToast("초대를 거절했습니다.");
        }
      } catch (e) {
        showToast(`처리 중 오류: ${e.message}`);
      }

      saveLocalState();
      renderAll();
      renderNotificationList();
    }

    async function markAllNotificationsRead() {
      appState.notifications.forEach(n => n.is_read = true);
      saveLocalState();
      updateBellBadge();
      renderNotificationList();
      if (currentUser) {
        try {
          await sbRequest(`/tripic_notifications?to_code=eq.${encodeURIComponent(currentUser.code)}`, {
            method: "PATCH",
            body: JSON.stringify({ is_read: true })
          });
        } catch (e) {}
      }
    }

    function updateBellBadge() {
      const unreadCount = appState.notifications.filter(n => !n.is_read).length;
      const badge = document.getElementById("bellBadge");
      badge.textContent = unreadCount;
      if (unreadCount > 0) badge.classList.add("visible");
      else badge.classList.remove("visible");
    }

    function renderNotificationList() {
      const container = document.getElementById("notifListContainer");
      if (appState.notifications.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:28px 0; color:var(--text-sub); font-size:13px;">도착한 알림이 없습니다.</div>`;
        return;
      }

      container.innerHTML = appState.notifications.map(n => `
        <div class="notif-item ${n.is_read ? "" : "unread"}">
          <div style="font-size:13.5px; font-weight:700; margin-bottom:4px;">
            ${n.from_name}님의 동행 초대
          </div>
          <div style="font-size:12.5px; color:var(--text-sub); margin-bottom:8px;">
            '${n.trip_title}' 일정에 함께 편집자로 초대되었습니다.
          </div>
          ${n.status === "pending" ? `
            <div style="display:flex; gap:8px;">
              <button type="button" class="btn btn-sm btn-primary" onclick="respondInvite('${n.id}', true)">수락하고 합류</button>
              <button type="button" class="btn btn-sm btn-outline" onclick="respondInvite('${n.id}', false)">거절</button>
            </div>
          ` : `
            <span style="font-size:11.5px; font-weight:600; color:var(--primary-green);">
              ${n.status === "accepted" ? "✓ 수락 완료" : "✕ 거절됨"}
            </span>
          `}
        </div>
      `).join("");
    }

    /* =========================================================
       9. Account Auth (Sign Up / Login / Logout)
       ========================================================= */
    function generateInviteCode() {
      return String(Math.floor(1000 + Math.random() * 9000));
    }

    async function handleRegister() {
      const userId = document.getElementById("authIdInput").value.trim();
      const pw = document.getElementById("authPwInput").value.trim();
      const nickname = document.getElementById("authNickInput").value.trim();

      if (!userId || !pw || !nickname) {
        showToast("아이디, 비밀번호, 닉네임을 모두 입력해 주세요.");
        return;
      }

      const code = generateInviteCode();
      try {
        await sbRequest("/tripic_users", {
          method: "POST",
          body: JSON.stringify({
            user_id: userId,
            pw,
            nickname,
            code,
            created_at: new Date().toISOString()
          })
        });

        currentUser = { user_id: userId, nickname, code };
        localStorage.setItem("tripic_current_user", JSON.stringify(currentUser));
        loadLocalState();
        await syncWithSupabase(false);
        renderAll();
        showToast(`${nickname}님 환영합니다! (초대코드: ${code})`);
      } catch (e) {
        showToast(`회원가입 실패: ${e.message}`);
      }
    }

    async function handleLogin() {
      const userId = document.getElementById("authIdInput").value.trim();
      const pw = document.getElementById("authPwInput").value.trim();
      if (!userId || !pw) {
        showToast("아이디와 비밀번호를 입력해 주세요.");
        return;
      }

      try {
        const users = await sbRequest(`/tripic_users?user_id=eq.${encodeURIComponent(userId)}&pw=eq.${encodeURIComponent(pw)}`);
        if (!Array.isArray(users) || users.length === 0) {
          showToast("아이디 또는 비밀번호가 일치하지 않습니다.");
          return;
        }
        const u = users[0];
        currentUser = { user_id: u.user_id, nickname: u.nickname, code: u.code };
        localStorage.setItem("tripic_current_user", JSON.stringify(currentUser));
        loadLocalState();
        await syncWithSupabase(false);
        renderAll();
        showToast(`${u.nickname}님으로 로그인되었습니다.`);
      } catch (e) {
        showToast(`로그인 오류: ${e.message}`);
      }
    }

    function handleLogout() {
      currentUser = null;
      localStorage.removeItem("tripic_current_user");
      loadLocalState();
      renderAll();
      showToast("로그아웃되었습니다. 게스트 공간으로 전환됩니다.");
    }

    /* =========================================================
       10. Renderers (Itinerary, Map, Account)
       ========================================================= */
    function renderAll() {
      document.getElementById("headerUserLabel").textContent = currentUser ? currentUser.nickname : "게스트";
      updateBellBadge();
      renderItineraryTab();
      renderMapTab();
      renderAccountTab();
    }

    function renderItineraryTab() {
      const selectorWrap = document.getElementById("tripSwitcherWrap");
      const selector = document.getElementById("tripSelector");
      const container = document.getElementById("itineraryContent");

      if (appState.trips.length > 1) {
        selectorWrap.style.display = "block";
        selector.innerHTML = appState.trips.map(t =>
          `<option value="${t.id}" ${t.id === appState.activeTripId ? "selected" : ""}>${t.title} (${t.city})</option>`
        ).join("");
      } else {
        selectorWrap.style.display = "none";
      }

      const trip = getActiveTrip();
      if (!trip) {
        container.innerHTML = `<div class="section-card">아직 생성된 여행 일정이 없습니다.</div>`;
        return;
      }

      const editable = canEditTrip(trip);
      const totalDays = diffDays(trip.startDate, trip.endDate) + 1;
      if (appState.activeDay > totalDays) appState.activeDay = 1;

      const dayStops = trip.days[appState.activeDay] || [];

      let dayPillsHtml = "";
      for (let d = 1; d <= totalDays; d++) {
        dayPillsHtml += `<button type="button" class="day-pill ${d === appState.activeDay ? "active" : ""}" onclick="selectDay(${d})">Day ${d}</button>`;
      }

      const membersHtml = (trip.members || []).map(m => `<span class="member-chip">${m.nickname}</span>`).join("");

      const stopsHtml = dayStops.length === 0
        ? `<div class="section-card" style="text-align:center; padding:28px 16px; color:var(--text-sub); font-size:13.5px;">
            Day ${appState.activeDay} 일정이 비어 있습니다.<br/>아래 버튼을 눌러 장소를 추가해 보세요.
           </div>`
        : dayStops.map((s, idx) => `
          <div class="stop-card">
            <div class="stop-order">${idx + 1}</div>
            <div class="stop-body">
              <div class="stop-top">
                <div class="stop-name">${s.name}</div>
                <span class="stop-cat">${s.cat} · ${s.time}</span>
              </div>
              <div class="stop-addr">${s.addr}</div>
              ${s.memo ? `<div class="stop-memo">📝 ${s.memo}</div>` : ""}
              ${editable ? `
                <div class="stop-actions">
                  <button type="button" class="btn btn-sm btn-outline" onclick="openStopModal(${idx})">수정</button>
                  <button type="button" class="btn btn-sm btn-outline" onclick="moveStop(${idx}, -1)">↑</button>
                  <button type="button" class="btn btn-sm btn-outline" onclick="moveStop(${idx}, 1)">↓</button>
                  <button type="button" class="btn btn-sm btn-danger" onclick="removeStop(${idx})">삭제</button>
                </div>
              ` : ""}
            </div>
          </div>
        `).join("");

      container.innerHTML = `
        <div class="trip-hero">
          <div class="trip-hero-top">
            <div>
              <div class="trip-hero-city">📍 ${trip.city}</div>
              <div class="trip-hero-title">${trip.title}</div>
              <div class="trip-hero-meta">
                <span>${trip.startDate} ~ ${trip.endDate}</span>
                <span>· ${trip.people}</span>
              </div>
            </div>
            <button type="button" class="btn btn-sm" style="background:rgba(255,255,255,0.18); color:#FFFFFF;" onclick="openInviteModal()">+ 친구 초대</button>
          </div>
          <div class="collab-bar">
            <div class="member-chips">${membersHtml}</div>
            <span style="font-size:11px; color:#D2E0D5;">${editable ? "편집 가능" : "열람 전용"}</span>
          </div>
        </div>

        <div class="day-pills">${dayPillsHtml}</div>
        ${stopsHtml}
        ${editable ? `<button type="button" class="btn btn-primary btn-block" style="margin-top:6px;" onclick="openStopModal(null)">+ Day ${appState.activeDay} 장소 추가</button>` : ""}
      `;
    }

    function selectDay(dayNum) {
      appState.activeDay = dayNum;
      saveLocalState();
      renderItineraryTab();
    }

    function renderMapTab() {
      const container = document.getElementById("mapContent");
      const trip = getActiveTrip();
      if (!trip) {
        container.innerHTML = `<div class="section-card">표시할 여행 동선이 없습니다.</div>`;
        return;
      }
      const stops = trip.days[appState.activeDay] || [];
      container.innerHTML = `
        <div class="section-card">
          <div class="card-title-row">
            <div>
              <div class="card-title">${trip.city} · Day ${appState.activeDay} 동선</div>
              <div class="card-sub">총 ${stops.length}개 경유지 순서 요약</div>
            </div>
          </div>
          <div class="route-visual">
            ${stops.length === 0 ? `<div style="font-size:13px; color:var(--text-sub);">등록된 장소가 없습니다.</div>` : stops.map((s, i) => `
              <div class="route-step">
                <div class="stop-order" style="background:#315C4C; color:#FFFFFF;">${i + 1}</div>
                <div>
                  <div style="font-size:14px; font-weight:700;">${s.name} <span style="font-size:11.5px; color:var(--text-sub);">(${s.time})</span></div>
                  <div style="font-size:12px; color:var(--text-sub);">${s.addr}</div>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function renderAccountTab() {
      const container = document.getElementById("accountContent");
      const cloudHtml = `
        <div class="section-card">
          <div class="card-title-row">
            <div>
              <div class="card-title">Supabase 클라우드 실시간 연동</div>
              <div class="card-sub">${syncStatus.label}</div>
            </div>
            <button type="button" class="btn btn-sm btn-sage" onclick="syncWithSupabase(true)">지금 동기화</button>
          </div>
          <div class="status-box">${syncStatus.detail || "고정 프로젝트에 자동 연결되어 있습니다."}</div>
        </div>
      `;

      if (!currentUser) {
        container.innerHTML = `
          ${cloudHtml}
          <div class="section-card">
            <div class="card-title-row">
              <div>
                <div class="card-title">로그인 및 회원가입</div>
                <div class="card-sub">계정별로 일정이 격리되며 친구 초대가 활성화됩니다</div>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="authIdInput">아이디</label>
              <input type="text" id="authIdInput" class="form-input" placeholder="영문/숫자 아이디" />
            </div>
            <div class="form-group">
              <label class="form-label" for="authPwInput">비밀번호</label>
              <input type="password" id="authPwInput" class="form-input" placeholder="비밀번호 입력" />
            </div>
            <div class="form-group">
              <label class="form-label" for="authNickInput">닉네임 (회원가입 시 입력)</label>
              <input type="text" id="authNickInput" class="form-input" placeholder="동행자에게 표시될 이름" />
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
              <button type="button" class="btn btn-primary" onclick="handleLogin()">로그인</button>
              <button type="button" class="btn btn-sage" onclick="handleRegister()">회원가입</button>
            </div>
          </div>
        `;
      } else {
        container.innerHTML = `
          ${cloudHtml}
          <div class="section-card">
            <div class="card-title-row">
              <div>
                <div class="card-title">${currentUser.nickname} (@${currentUser.user_id})</div>
                <div class="card-sub">내 초대코드: <strong style="color:var(--primary-green); font-size:15px;">${currentUser.code}</strong></div>
              </div>
              <button type="button" class="btn btn-sm btn-danger" onclick="handleLogout()">로그아웃</button>
            </div>
            <p style="font-size:12.5px; color:var(--text-sub); line-height:1.5;">
              친구에게 위 4자리 초대코드를 알려주면 여행 일정에 초대받을 수 있으며, 초대된 인원만 함께 일정을 편집할 수 있습니다.
            </p>
          </div>
        `;
      }
    }

    /* =========================================================
       11. Bootstrap App
       ========================================================= */
    function initApp() {
      setTimeout(() => {
        document.getElementById("splashScreen").classList.add("hidden");
      }, 1100);

      try {
        const savedUser = localStorage.getItem("tripic_current_user");
        if (savedUser) currentUser = JSON.parse(savedUser);
      } catch (e) {}

      loadLocalState();
      resetCreateForm();
      renderAll();
      syncWithSupabase(false);

      // Periodic background sync for real-time collaborative edits & invites
      syncTimer = setInterval(() => {
        if (currentUser) syncWithSupabase(false);
      }, 8000);
    }

    window.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
