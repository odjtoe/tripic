<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TRIPIC · 트립픽</title>
  <style>
    :root {
      --bg: #F8F7F3;
      --card: #FFFFFF;
      --green: #315C4C;
      --green-dark: #234438;
      --emerald: #00B86B;
      --sage: #E7EEE8;
      --sage-dark: #D3E0D6;
      --text: #1E2421;
      --muted: #6C7771;
      --border: #E3E6E1;
      --danger: #D9383A;
      --shadow: 0 6px 20px rgba(49, 92, 76, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #ECEBE4;
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      background: var(--bg);
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 36px rgba(0, 0, 0, 0.08);
      overflow-x: hidden;
    }

    /* Splash Screen */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.45s ease, visibility 0.45s ease;
      cursor: pointer;
    }

    #splash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-svg {
      width: 280px;
      max-width: 76vw;
      height: auto;
      overflow: visible;
    }

    .sp-pin-start {
      opacity: 0;
      transform-origin: 48px 54px;
      animation: popIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
    }

    .sp-word {
      opacity: 0;
      animation: fadeSlide 0.4s ease 0.2s forwards;
    }

    .sp-route {
      stroke-dasharray: 280;
      stroke-dashoffset: 280;
      animation: drawLine 0.65s ease-out 0.38s forwards;
    }

    .sp-arrow {
      opacity: 0;
      animation: popIn 0.22s ease 0.95s forwards;
    }

    .sp-pin-end {
      opacity: 0;
      transform-origin: 272px 96px;
      animation: popIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) 1.05s forwards;
    }

    .sp-sub {
      margin-top: 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--green);
      letter-spacing: 0.04em;
      opacity: 0;
      animation: fadeSlide 0.4s ease 0.75s forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.4) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }

    /* Sticky Top Header */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(248, 247, 243, 0.94);
      backdrop-filter: blur(10px);
      padding: 13px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .brand-title {
      font-weight: 900;
      font-size: 20px;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, #1E4D3B 0%, #00B86B 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--green);
      background: var(--sage);
      padding: 3px 8px;
      border-radius: 99px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-pill {
      font-size: 12px;
      font-weight: 700;
      color: var(--green);
      background: var(--sage);
      padding: 6px 12px;
      border-radius: 99px;
      cursor: pointer;
    }

    .bell-btn {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--green);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .bell-btn:active {
      transform: scale(0.95);
    }

    .bell-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 99px;
      background: var(--danger);
      color: #FFFFFF;
      font-size: 10.5px;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg);
      line-height: 1;
      box-shadow: 0 2px 6px rgba(217, 56, 58, 0.35);
    }

    .bell-badge.show {
      display: inline-flex;
    }

    /* Top Slide-Down Alert Banner */
    #inAppAlertBanner {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(-140%);
      width: calc(100% - 28px);
      max-width: 412px;
      background: #1E2421;
      color: #FFFFFF;
      border-radius: 16px;
      padding: 13px 15px;
      box-shadow: 0 12px 30px rgba(20, 28, 24, 0.26);
      z-index: 350;
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
      opacity: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    #inAppAlertBanner.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .alert-banner-ico {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: var(--green);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .alert-banner-body {
      flex: 1;
      min-width: 0;
    }

    .alert-banner-title {
      font-size: 13px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 2px;
    }

    .alert-banner-desc {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.82);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Main Content */
    main {
      flex: 1;
      padding: 16px 16px 96px;
      min-width: 0;
    }

    .tab-panel {
      display: none;
      min-width: 0;
    }

    .tab-panel.active {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      min-width: 0;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .btn:active {
      transform: scale(0.985);
    }

    .btn-primary {
      background: var(--green);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--green-dark);
    }

    .btn-sage {
      background: var(--sage);
      color: var(--green);
    }

    .btn-outline {
      background: #fff;
      color: var(--green);
      border: 1.5px solid var(--green);
    }

    .btn-danger {
      background: #FDECEC;
      color: var(--danger);
    }

    .btn-sm {
      padding: 8px 12px;
      font-size: 13px;
      border-radius: 10px;
      width: auto;
    }

    /* Empty State */
    .empty-box {
      text-align: center;
      padding: 34px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      margin-top: 10px;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: var(--sage);
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .empty-title {
      font-size: 19px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }

    .empty-desc {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 22px;
    }

    .empty-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Trip Switcher */
    .switcher-wrap {
      margin-bottom: 12px;
    }

    .switcher-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .trip-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .trip-chips::-webkit-scrollbar {
      display: none;
    }

    .trip-chip {
      flex-shrink: 0;
      padding: 8px 14px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
      cursor: pointer;
    }

    .trip-chip.active {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    /* Route Banner */
    .route-banner {
      background: linear-gradient(135deg, #315C4C 0%, #24483B 100%);
      color: #fff;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .route-banner-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .route-city {
      font-size: 12px;
      font-weight: 700;
      opacity: 0.85;
      margin-bottom: 4px;
    }

    .route-name {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.25;
    }

    .route-dates {
      font-size: 12.5px;
      opacity: 0.85;
      margin-top: 6px;
    }

    .perm-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 99px;
      flex-shrink: 0;
      background: rgba(0, 184, 107, 0.26);
      color: #CFFCE6;
      border: 1px solid rgba(0, 230, 138, 0.35);
    }

    .perm-badge.readonly {
      background: rgba(255, 244, 214, 0.22);
      color: #FFF6DC;
      border-color: rgba(255, 244, 214, 0.35);
    }

    .collab-bar {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .member-avatars {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .member-tag {
      background: rgba(255, 255, 255, 0.16);
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .invite-mini-btn {
      background: #fff;
      color: var(--green);
      border: none;
      border-radius: 99px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }

    .collab-status-strip {
      margin-top: 10px;
      padding: 7px 11px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.13);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00E68A;
      margin-right: 6px;
      box-shadow: 0 0 0 3px rgba(0, 230, 138, 0.25);
    }

    /* Inline Route Map Card above DAY selector */
    .inline-map-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .inline-map-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding: 0 2px;
    }

    #routeCanvas {
      width: 100%;
      height: 210px;
      border-radius: 12px;
      background: #EEF4EF;
      display: block;
    }

    /* Toolbar & Day Tabs */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .day-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .day-tabs::-webkit-scrollbar {
      display: none;
    }

    .day-tab {
      padding: 7px 13px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
      cursor: pointer;
      flex-shrink: 0;
    }

    .day-tab.active {
      background: var(--sage);
      color: var(--green);
      border-color: var(--green);
    }

    /* Stop Cards */
    .hint-bar {
      font-size: 12px;
      color: var(--muted);
      background: var(--sage);
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stop-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      position: relative;
      user-select: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .stop-card.pressing {
      transform: scale(0.98);
      box-shadow: 0 0 0 2px var(--green);
    }

    .stop-top {
      display: flex;
      align-items: flex-start;
      gap: 11px;
    }

    .stop-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--green);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .stop-info {
      flex: 1;
      min-width: 0;
    }

    .stop-cat {
      font-size: 11px;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 2px;
    }

    .stop-title {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--text);
    }

    .stop-meta {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 3px;
    }

    .stop-addr {
      font-size: 11.5px;
      color: var(--green);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }

    .stop-memo-preview {
      margin-top: 8px;
      background: var(--bg);
      border-left: 3px solid var(--green);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: var(--text);
    }

    .stop-actions {
      display: flex;
      gap: 6px;
      margin-top: 11px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .mini-act {
      flex: 1;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 9px;
      padding: 7px 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .mini-act.del {
      color: var(--danger);
      background: #FFF6F6;
      border-color: #F6D6D6;
    }

    /* Forms & Inputs */
    .mode-switch {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
      background: var(--sage);
      padding: 5px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      padding: 10px 8px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--green);
      cursor: pointer;
      min-width: 0;
      white-space: nowrap;
    }

    .mode-btn.active {
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
    }

    .field {
      margin-bottom: 14px;
      min-width: 0;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
    }

    .input, select, textarea {
      display: block;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      padding: 11px 12px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
      font-family: inherit;
    }

    select {
      min-height: 44px;
    }

    .input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--green);
    }

    .row-2 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      width: 100%;
    }

    .tag-group {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .choice-chip {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .choice-chip.selected {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    .error-text {
      color: var(--danger);
      font-size: 12px;
      font-weight: 700;
      margin-top: 5px;
      display: none;
    }

    .error-text.show {
      display: block;
    }

    /* Autocomplete Dropdown */
    .ac-wrap {
      position: relative;
    }

    .ac-list {
      margin-top: 6px;
      background: #fff;
      border: 1.5px solid var(--green);
      border-radius: 14px;
      box-shadow: 0 10px 26px rgba(30, 36, 33, 0.12);
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }

    .ac-list.open {
      display: block;
    }

    .ac-status {
      padding: 9px 12px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .ac-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .ac-item:last-child {
      border-bottom: none;
    }

    .ac-item:hover, .ac-item:active {
      background: var(--sage);
    }

    .ac-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 3px;
    }

    .ac-name {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text);
    }

    .ac-badge {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--green);
      background: var(--sage);
      padding: 2px 7px;
      border-radius: 99px;
      flex-shrink: 0;
    }

    .ac-badge-city {
      font-size: 10.5px;
      font-weight: 800;
      color: #fff;
      background: var(--green);
      padding: 2px 7px;
      border-radius: 99px;
      flex-shrink: 0;
    }

    .ac-addr {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.35;
    }

    .verified-city-pill {
      display: none;
      align-items: center;
      gap: 6px;
      margin-top: 7px;
      padding: 6px 11px;
      border-radius: 99px;
      background: var(--sage);
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
    }

    .verified-city-pill.show {
      display: inline-flex;
    }

    /* Inline Range Date Picker */
    .range-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      background: #fff;
      cursor: pointer;
    }

    .range-trigger.open {
      border-color: var(--green);
      background: #FCFDFC;
    }

    .range-col {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .range-sub {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .range-date-txt {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
    }

    .range-sep {
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }

      font-size: 11px;
      font-weight: 800;
      color: var(--green);
      background: var(--sage);
      padding: 5px 9px;
      border-radius: 99px;
      flex-shrink: 0;
    }

    .range-cal-box {
      display: none;
      margin-top: 8px;
      background: #fff;
      border: 1.5px solid var(--green);
      border-radius: 16px;
      padding: 14px 12px;
      box-shadow: 0 10px 26px rgba(30, 36, 33, 0.11);
    }

    .range-cal-box.open {
      display: block;
    }

    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .cal-nav-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .cal-month-title {
      font-size: 14.5px;
      font-weight: 800;
      color: var(--text);
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      text-align: center;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .cal-weekdays span:first-child {
      color: var(--danger);
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      row-gap: 4px;
    }

    .cal-cell {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
    }

    .cal-cell.empty {
      cursor: default;
    }

    .cal-cell.sun {
      color: var(--danger);
    }

    .cal-cell.in-range {
      background: var(--sage);
      color: var(--green);
    }

    .cal-cell.range-start,
    .cal-cell.range-end {
      background: var(--green);
      color: #fff;
      font-weight: 800;
    }

    .cal-cell.range-start {
      border-radius: 10px 0 0 10px;
    }

    .cal-cell.range-end {
      border-radius: 0 10px 10px 0;
    }

    .cal-cell.range-start.range-end {
      border-radius: 10px;
    }

    .cal-footer {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      color: var(--muted);

      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;

      background: #FBFDFB;

      font-size: 11px;
      font-weight: 800;
      color: #fff;
      background: var(--green);
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 6px;

    .code-box {

      border-radius: 16px;
      padding: 16px;
      text-align: center;
      margin: 14px 0;

      font-weight: 900;
      letter-spacing: 0.22em;

      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 800;
      padding: 4px 10px;

      color: #0D7A4B;
    }

    .sb-status-badge.local {
      background: var(--sage);
      color: var(--green);
    }

    /* Notification Drawer Items */
    .notif-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }

    .notif-item {
      border: 1px solid var(--border);
      background: #FFFFFF;
      border-radius: 15px;
      padding: 13px 14px;
      margin-bottom: 9px;
    }

    .notif-item.unread {
      background: #F4F8F5;
      border-color: var(--green);
    }

    .notif-unread-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--danger);
      margin-right: 6px;
      vertical-align: middle;
    }

    .notif-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .notif-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text);
    }

    .notif-time {
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .notif-msg {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.45;
    }

    .notif-actions {
      display: flex;
      gap: 7px;
      margin-top: 10px;
    }

    /* Bottom Navigation (3 Tabs) */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      padding: 8px 2px 12px;
      z-index: 50;
    }

    .nav-item {
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      min-width: 0;
    }

    .nav-item.active {
      color: var(--green);
    }

    .nav-ico {
      width: 21px;
      height: 21px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Modals & Toast */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 28, 24, 0.5);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 24px 24px 0 0;
      padding: 22px 18px 28px;
      max-height: 85vh;
      overflow-y: auto;
      animation: slideUp 0.2s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    #toast {
      position: fixed;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #1E2421;
      color: #fff;
      padding: 10px 16px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.22s ease;
      z-index: 300;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    function genCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let out = '';
      for (let i = 0; i < 4; i++) {
        out += chars[Math.floor(Math.random() * chars.length)];
      }
      return out;
    }

    function getCityCoreKeyword(officialRegion) {
      const text = (officialRegion || '').trim();
      if (!text) return '';
      const dbHit = OFFICIAL_REGIONS_DB.find(r => r.official === text);
      if (dbHit) return dbHit.core;
      const parts = text.split(/\s+/);
      const last = parts[parts.length - 1] || text;
      return last.replace(/(특별자치도|특별자치시|특별시|광역시|자치구|도|시|군|구)$/, '') || text;
    }

    function toIsoLocal(year, monthZeroIndexed, day) {
      const d = new Date(year, monthZeroIndexed, day);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${dd}`;
    }

    function parseIsoLocal(isoStr) {
      const [y, m, d] = (isoStr || '').split('-').map(Number);
      if (!y || !m || !d) return new Date();
      return new Date(y, m - 1, d);
    }

    function formatKoreanShortDate(isoStr) {
      if (!isoStr) return '-';
      const dt = parseIsoLocal(isoStr);
      const wdays = ['일', '월', '화', '수', '목', '금', '토'];
      return `${dt.getMonth() + 1}.${String(dt.getDate()).padStart(2, '0')} (${wdays[dt.getDay()]})`;
    }

    function updateRangeSummaryUI() {
      const startInp = document.getElementById('inpStart');
      const endInp = document.getElementById('inpEnd');
      const dispStart = document.getElementById('dispStartDate');
      const dispEnd = document.getElementById('dispEndDate');
      const badge = document.getElementById('dispNightsBadge');
      if (!startInp || !endInp || !dispStart || !dispEnd || !badge) return;

      startInp.value = rangeState.start;
      endInp.value = rangeState.end;
      dispStart.textContent = formatKoreanShortDate(rangeState.start);
      dispEnd.textContent = rangeState.selectingEnd ? '도착일 선택' : formatKoreanShortDate(rangeState.end);

      const d1 = parseIsoLocal(rangeState.start);
      const d2 = parseIsoLocal(rangeState.end || rangeState.start);
      const days = Math.max(1, Math.round((d2 - d1) / 86400000) + 1);
      badge.textContent = days === 1 ? '당일치기' : `${days - 1}박 ${days}일`;
    }

    function toggleRangeCalendar() {
      rangeState.isOpen = !rangeState.isOpen;
      const box = document.getElementById('rangeCalBox');
      const trigger = document.getElementById('rangeTriggerBtn');
      if (box) box.classList.toggle('open', rangeState.isOpen);
      if (trigger) trigger.classList.toggle('open', rangeState.isOpen);
      if (rangeState.isOpen) renderRangeCalendar();
    }

    function closeRangeCalendar() {
      rangeState.isOpen = false;
      rangeState.selectingEnd = false;
      if (!rangeState.end) rangeState.end = rangeState.start;
      updateRangeSummaryUI();
      const box = document.getElementById('rangeCalBox');
      const trigger = document.getElementById('rangeTriggerBtn');
      if (box) box.classList.remove('open');
      if (trigger) trigger.classList.remove('open');
    }

    function shiftCalMonth(delta) {
      let m = rangeState.viewMonth + delta;
      let y = rangeState.viewYear;
      if (m < 0) {
        m = 11;
        y -= 1;
      } else if (m > 11) {
        m = 0;
        y += 1;
      }
      rangeState.viewYear = y;
      rangeState.viewMonth = m;
      renderRangeCalendar();
    }

    function renderRangeCalendar() {
      const titleEl = document.getElementById('calMonthTitle');
      const gridEl = document.getElementById('calGrid');
      const guideEl = document.getElementById('calGuideText');
      if (!titleEl || !gridEl) return;

      const y = rangeState.viewYear;
      const m = rangeState.viewMonth;
      titleEl.textContent = `${y}년 ${m + 1}월`;
      if (guideEl) {
        guideEl.textContent = rangeState.selectingEnd
          ? '도착일을 선택하세요 (최대 10일 코스)'
          : '출발일과 도착일을 순서대로 터치하세요 (최대 10일)';
      }

      const firstDow = new Date(y, m, 1).getDay();
      const lastDate = new Date(y, m + 1, 0).getDate();
      let cellsHtml = '';

      for (let i = 0; i < firstDow; i++) {
        cellsHtml += `<div class="cal-cell empty"></div>`;
      }

      for (let day = 1; day <= lastDate; day++) {
        const iso = toIsoLocal(y, m, day);
        const dow = (firstDow + day - 1) % 7;
        const isStart = iso === rangeState.start;
        const isEnd = iso === rangeState.end;
        const inRange = rangeState.start && rangeState.end && iso > rangeState.start && iso < rangeState.end;

        const cls = ['cal-cell'];
        if (dow === 0) cls.push('sun');
        if (inRange) cls.push('in-range');
        if (isStart) cls.push('range-start');
        if (isEnd) cls.push('range-end');

        cellsHtml += `<button type="button" class="${cls.join(' ')}" onclick="selectRangeDate('${iso}')">${day}</button>`;
      }

      gridEl.innerHTML = cellsHtml;
    }

    function selectRangeDate(iso) {
      if (!rangeState.selectingEnd || iso < rangeState.start) {
        rangeState.start = iso;
        rangeState.end = iso;
        rangeState.selectingEnd = true;
      } else {
        const d1 = parseIsoLocal(rangeState.start);
        const d2 = parseIsoLocal(iso);
        const diffDays = Math.round((d2 - d1) / 86400000) + 1;
        if (diffDays > 10) {
          const capped = new Date(d1.getFullYear(), d1.getMonth(), d1.getDate() + 9);
          rangeState.end = toIsoLocal(capped.getFullYear(), capped.getMonth(), capped.getDate());
          showToast('최대 10일 코스까지 선택할 수 있어 자동 조정되었습니다.');
        } else {
          rangeState.end = iso;
        }
        rangeState.selectingEnd = false;
      }
      updateRangeSummaryUI();
      renderRangeCalendar();
    }

    function getCurrentActorId() {
      if (state.currentUser && state.currentUser.userId) {
        return state.currentUser.userId;
      }
      if (!state.guestId) {
        state.guestId = 'guest_' + (state.guestCode || genCode());
      }
      return state.guestId;
    }

    function getCurrentActorLabel() {
      if (state.currentUser && state.currentUser.nickname) {
        return `${state.currentUser.nickname}(${state.currentUser.code})`;
      }
      return `게스트(${getMyCode()})`;
    }

    function getScopedStateKey(userId) {
      return userId ? `tripic_app_state_v2_${userId}` : 'tripic_app_state_v2_guest';
    }

    function canEditTrip(trip) {
      if (!trip) return false;
      const actorId = getCurrentActorId();
      const memberIds = Array.isArray(trip.memberIds) ? trip.memberIds : [];
      return trip.ownerId === actorId || memberIds.includes(actorId);
    }

    function ensureCanEdit(trip) {
      if (!canEditTrip(trip)) {
        showToast('초대된 동행자만 일정을 편집할 수 있습니다.');
        return false;
      }
      return true;
    }

    function normalizeTripOwnership(trip) {
      if (!trip) return trip;
      const actorId = getCurrentActorId();
      if (!trip.ownerId) {
        trip.ownerId = actorId;
      }
      if (!Array.isArray(trip.memberIds)) {
        trip.memberIds = [trip.ownerId];
      } else if (!trip.memberIds.includes(trip.ownerId)) {
        trip.memberIds.unshift(trip.ownerId);
      }
      return trip;
    }

    function loadUsersRegistry() {
      try {
        const raw = localStorage.getItem(USERS_REGISTRY_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }

    function saveUsersRegistry(usersList) {
      try {
        localStorage.setItem(USERS_REGISTRY_KEY, JSON.stringify(usersList || []));
      } catch (e) {}
    }

    function loadScopedAccountData(userObj) {
      const users = loadUsersRegistry();
      const userId = userObj && userObj.userId ? userObj.userId : null;
      const key = getScopedStateKey(userId);

      let loaded = null;
      try {
        const raw = localStorage.getItem(key);
        if (raw) loaded = JSON.parse(raw);
      } catch (e) {}

      const preservedGuestCode = (loaded && loaded.guestCode) || state.guestCode || genCode();
      const preservedGuestId = (loaded && loaded.guestId) || state.guestId || ('guest_' + preservedGuestCode);

      state = {
        trips: Array.isArray(loaded && loaded.trips) ? loaded.trips.map(normalizeTripOwnership) : [],
        activeTripId: (loaded && loaded.activeTripId) || null,
        activeDay: (loaded && loaded.activeDay) || 1,
        viewMode: (loaded && loaded.viewMode) || 'timeline',
        createMode: (loaded && loaded.createMode) || 'manual',
        currentUser: userObj || null,
        users,
        guestId: preservedGuestId,
        guestCode: preservedGuestCode,
        notifications: Array.isArray(loaded && loaded.notifications) ? loaded.notifications : []
      };

      if (state.activeTripId && !state.trips.some(t => t.id === state.activeTripId)) {
        state.activeTripId = state.trips[0] ? state.trips[0].id : null;
      }
    }

    function loadState() {
      let activeUser = null;
      try {
        const rawSess = localStorage.getItem(SESSION_KEY);
        if (rawSess) {
          const sess = JSON.parse(rawSess);
          if (sess && sess.userId) {
            const reg = loadUsersRegistry();
            activeUser = reg.find(u => u.userId === sess.userId) || sess;
          }
        }
      } catch (e) {}

      loadScopedAccountData(activeUser);
    }

    function saveState() {
      try {
        const userId = state.currentUser && state.currentUser.userId ? state.currentUser.userId : null;
        localStorage.setItem(SESSION_KEY, JSON.stringify({ userId }));
        saveUsersRegistry(state.users);

        const scopedPayload = {
          trips: state.trips,
          activeTripId: state.activeTripId,
          activeDay: state.activeDay,
          viewMode: state.viewMode,
          createMode: state.createMode,
          guestId: state.guestId,
          guestCode: state.guestCode,
          notifications: state.notifications
        };
        localStorage.setItem(getScopedStateKey(userId), JSON.stringify(scopedPayload));
      } catch (e) {}
      updateBellBadge();
    }

    /* Supabase REST + Optional Realtime */
    async function sbRestFetch(pathWithQuery, options = {}) {
      const baseUrl = normalizeSupabaseUrl(supabaseConfig.url);
      const apiKey = (supabaseConfig.anonKey || '').trim();
      const headers = {
        'apikey': apiKey,
        'Content-Type': 'application/json',
        ...(options.headers || {})
      };
      if (apiKey && !apiKey.startsWith('sb_publishable_')) {
        headers['Authorization'] = `Bearer ${apiKey}`;
      }
      const res = await fetch(`${baseUrl}/rest/v1/${pathWithQuery}`, {
        method: options.method || 'GET',
        headers,
        body: options.body !== undefined ? JSON.stringify(options.body) : undefined
      });
      const text = await res.text();
      let data = null;
      try {
        data = text ? JSON.parse(text) : null;
      } catch (e) {
        data = text;
      }
      if (!res.ok) {
        const msg = (data && (data.message || data.hint || data.details || data.code)) || `HTTP ${res.status}`;
        const err = new Error(String(msg));
        err.status = res.status;
        throw err;
      }
      return data;
    }

    async function checkSupabaseRestHealth() {
      try {
        await sbRestFetch('tripic_users?select=user_id&limit=1');
        return { ok: true, reason: '' };
      } catch (e) {
        if (e.status === 404 || /PGRST205|does not exist/i.test(e.message)) {
          return { ok: false, reason: '테이블 미생성 (SQL Editor에서 테이블을 생성해 주세요)' };
        }
        if (e.status === 401 || e.status === 403 || /permission|JWT|apikey/i.test(e.message)) {
          return { ok: false, reason: `권한/키 확인 필요 (HTTP ${e.status || ''}: ${e.message})` };
        }
        return { ok: false, reason: `연결 확인 필요 (${e.message || '응답 없음'})` };
      }
    }

    function ensureSupabaseSdkLoaded() {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        return Promise.resolve(true);
      }
      return new Promise(resolve => {
        const existing = document.querySelector('script[data-tripic-sb-sdk]');
        if (existing) {
          existing.addEventListener('load', () => resolve(true), { once: true });
          existing.addEventListener('error', () => resolve(false), { once: true });
          return;
        }
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
        script.async = true;
        script.setAttribute('data-tripic-sb-sdk', '1');
        script.onload = () => resolve(true);
        script.onerror = () => resolve(false);
        document.head.appendChild(script);
      });
    }

    function teardownSupabaseChannels() {
      if (!supabaseClient) return;
      [supabaseNotifChannel, supabaseTripsChannel, activeTripCollabChannel].forEach(ch => {
        if (ch) {
          try {
            supabaseClient.removeChannel(ch);
          } catch (e) {}
        }
      });
      supabaseNotifChannel = null;
      supabaseTripsChannel = null;
      activeTripCollabChannel = null;
      activeCollabTripId = null;
      activeTripOnlinePeers = [];
    }

    async function initSupabaseClient() {
      teardownSupabaseChannels();
      const baseUrl = normalizeSupabaseUrl(supabaseConfig.url);
      const apiKey = (supabaseConfig.anonKey || '').trim();

      const health = await checkSupabaseRestHealth();
      supabaseConnState.restOk = health.ok;
      supabaseConnState.lastCheckedAt = new Date().toISOString();
      supabaseConnState.errorDetail = health.ok ? '' : health.reason;

      const sdkOk = await ensureSupabaseSdkLoaded();
      if (sdkOk && window.supabase && typeof window.supabase.createClient === 'function') {
        try {
          supabaseClient = window.supabase.createClient(baseUrl, apiKey);
          subscribeToSupabaseRealtime();
          supabaseConnState.realtimeOk = true;
        } catch (e) {
          supabaseClient = null;
          supabaseConnState.realtimeOk = false;
        }
      } else {
        supabaseClient = null;
        supabaseConnState.realtimeOk = false;
      }

      if (health.ok) {
        await pullSupabaseDataForCurrentAccount();
        ensureActiveTripCollabChannel(getActiveTrip());
      }

      clearInterval(pollSyncTimer);
      pollSyncTimer = setInterval(() => {
        if (supabaseConnState.restOk) {
          pullSupabaseDataForCurrentAccount(true);
        }
      }, 5000);

      if (document.getElementById('tab-account')?.classList.contains('active')) {
        renderAccountTab();
      }
      return health.ok;
    }

    function isSupabaseReady() {
      return Boolean(supabaseConnState.restOk);
    }

    function mapSupabaseTripRow(row) {
      return normalizeTripOwnership({
        id: row.id,
        ownerId: row.owner_id || '',
        memberIds: Array.isArray(row.member_ids) ? row.member_ids : [],
        title: row.title,
        city: row.city,
        start: row.start_date,
        end: row.end_date,
        people: row.people,
        mode: row.mode,
        members: Array.isArray(row.members) ? row.members : [],
        days: row.days && typeof row.days === 'object' ? row.days : {},
        lastEditor: row.last_editor || '',
        updatedAt: row.updated_at || new Date().toISOString()
      });
    }

    function subscribeToSupabaseRealtime() {
      if (!supabaseClient) return;
      const actorId = getCurrentActorId();
      const myCode = getMyCode();
      if (!actorId && !myCode) return;

      supabaseNotifChannel = supabaseClient
        .channel(`tripic-notifs-${actorId}-${myCode}`)
        .on(
          'postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'tripic_notifications' },
          payload => {
            const row = payload.new;
            if (!row) return;
            const targetCode = row.to_code;
            const matchesUser = (row.to_user_id && row.to_user_id === actorId) || (targetCode && targetCode === myCode);
            if (!matchesUser) return;

            const senderName = row.from_name || '동행자';
            const tripSnap = row.trip_snapshot || null;
            ingestIncomingNotification({
              id: row.id,
              type: 'invite',
              title: `${senderName}님의 여행 동행 초대`,
              message: `'${row.trip_title || (tripSnap && tripSnap.title) || '여행'}' 일정에 초대했습니다.`,
              senderId: row.from_user_id || '',
              senderName,
              tripPayload: tripSnap,
              status: row.status || 'pending',
              read: Boolean(row.is_read),
              createdAt: row.created_at || new Date().toISOString()
            }, true);
          }
        )
        .subscribe();

      supabaseTripsChannel = supabaseClient
        .channel(`tripic-trips-member-${actorId}`)
        .on(
          'postgres_changes',
          { event: '*', schema: 'public', table: 'tripic_trips' },
          payload => {
            if (payload.eventType === 'DELETE' && payload.old && payload.old.id) {
              const idx = state.trips.findIndex(t => t.id === payload.old.id);
              if (idx !== -1) {
                state.trips.splice(idx, 1);
                if (state.activeTripId === payload.old.id) {
                  state.activeTripId = state.trips[0] ? state.trips[0].id : null;
                }
                saveState();
                renderActiveTab();
              }
              return;
            }

            const row = payload.new;
            if (!row) return;
            const memberIds = Array.isArray(row.member_ids) ? row.member_ids : [];
            const isAuthorized = row.owner_id === actorId || memberIds.includes(actorId);
            if (!isAuthorized) return;

            const incomingTrip = mapSupabaseTripRow(row);
            const existingIdx = state.trips.findIndex(t => t.id === incomingTrip.id);
            if (existingIdx !== -1) {
              const localTrip = state.trips[existingIdx];
              if (localTrip.updatedAt && incomingTrip.updatedAt && incomingTrip.updatedAt <= localTrip.updatedAt) {
                return;
              }
              state.trips[existingIdx] = incomingTrip;
              saveState();
              if (state.activeTripId === incomingTrip.id) {
                renderActiveTab();
              }
              if (incomingTrip.lastEditor && incomingTrip.lastEditor !== getCurrentActorLabel()) {
                showToast(`${incomingTrip.lastEditor}님이 일정을 업데이트했습니다.`);
              }
            } else {
              state.trips.unshift(incomingTrip);
              saveState();
              renderActiveTab();
            }
          }
        )
        .subscribe();
    }

    function ensureActiveTripCollabChannel(trip) {
      if (!supabaseClient || !trip || !canEditTrip(trip)) {
        if (activeTripCollabChannel && supabaseClient) {
          try {
            supabaseClient.removeChannel(activeTripCollabChannel);
          } catch (e) {}
        }
        activeTripCollabChannel = null;
        activeCollabTripId = null;
        activeTripOnlinePeers = [];
        return;
      }

      if (activeCollabTripId === trip.id && activeTripCollabChannel) {
        return;
      }

      if (activeTripCollabChannel) {
        try {
          supabaseClient.removeChannel(activeTripCollabChannel);
        } catch (e) {}
        activeTripCollabChannel = null;
      }

      activeCollabTripId = trip.id;
      const actorId = getCurrentActorId();
      const actorLabel = getCurrentActorLabel();

      const channel = supabaseClient.channel(`tripic-collab-${trip.id}`, {
        config: { presence: { key: actorId } }
      });

      channel
        .on('presence', { event: 'sync' }, () => {
          const presenceState = channel.presenceState();
          const peers = [];
          Object.keys(presenceState).forEach(key => {
            const entries = presenceState[key] || [];
            if (entries.length > 0 && entries[0].label) {
              peers.push(entries[0].label);
            }
          });
          activeTripOnlinePeers = Array.from(new Set(peers));
          const stripEl = document.getElementById('collabLivePeersText');
          if (stripEl) {
            stripEl.textContent = formatLivePeersText();
          }
        })
        .on('broadcast', { event: 'trip_patch' }, ({ payload }) => {
          if (!payload || payload.tripId !== trip.id || payload.editorId === actorId) return;
          const targetTrip = state.trips.find(t => t.id === trip.id);
          if (!targetTrip) return;

          if (payload.days) targetTrip.days = payload.days;
          if (payload.title) targetTrip.title = payload.title;
          if (Array.isArray(payload.members)) targetTrip.members = payload.members;
          if (Array.isArray(payload.memberIds)) targetTrip.memberIds = payload.memberIds;
          targetTrip.lastEditor = payload.editorLabel || '동행자';
          targetTrip.updatedAt = payload.updatedAt || new Date().toISOString();

          saveState();
          if (state.activeTripId === trip.id) {
            renderActiveTab();
          }
          showToast(`${targetTrip.lastEditor}님이 일정을 업데이트했습니다.`);
        })
        .subscribe(async status => {
          if (status === 'SUBSCRIBED') {
            try {
              await channel.track({
                actorId,
                label: actorLabel,
                onlineAt: new Date().toISOString()
              });
            } catch (e) {}
          }
        });

      activeTripCollabChannel = channel;
    }

    function formatLivePeersText() {
      if (!isSupabaseReady()) {
        return '초대된 동행자 전용 편집';
      }
      if (activeTripOnlinePeers.length > 1) {
        return `실시간 동시 편집 활성 (${activeTripOnlinePeers.length}명 접속 중)`;
      }
      return '실시간 클라우드 동기화 활성';
    }

    async function pullSupabaseDataForCurrentAccount(isBackground = false) {
      const actorId = getCurrentActorId();
      const myCode = getMyCode();
      if (!actorId) return;

      try {
        const encodedFilter = encodeURIComponent(`(owner_id.eq.${actorId},member_ids.cs.${JSON.stringify([actorId])})`);
        const tripRows = await sbRestFetch(`tripic_trips?select=*&or=${encodedFilter}&order=updated_at.desc`);
        let hasTripChanges = false;

        if (Array.isArray(tripRows)) {
          tripRows.forEach(row => {
            const mapped = mapSupabaseTripRow(row);
            const idx = state.trips.findIndex(t => t.id === mapped.id);
            if (idx === -1) {
              state.trips.unshift(mapped);
              hasTripChanges = true;
            } else if (!state.trips[idx].updatedAt || mapped.updatedAt > state.trips[idx].updatedAt) {
              state.trips[idx] = mapped;
              hasTripChanges = true;
            }
          });
          if (!state.activeTripId && state.trips.length > 0) {
            state.activeTripId = state.trips[0].id;
            hasTripChanges = true;
          }
        }

        const notifFilter = encodeURIComponent(`(to_user_id.eq.${actorId},to_code.eq.${myCode})`);
        const notifs = await sbRestFetch(`tripic_notifications?select=*&or=${notifFilter}&order=created_at.desc&limit=25`);

        if (Array.isArray(notifs)) {
          notifs.forEach(row => {
            const senderName = row.from_name || '동행자';
            const tripSnap = row.trip_snapshot || null;
            ingestIncomingNotification({
              id: row.id,
              type: 'invite',
              title: `${senderName}님의 여행 동행 초대`,
              message: `'${row.trip_title || (tripSnap && tripSnap.title) || '여행'}' 일정에 초대했습니다.`,
              senderId: row.from_user_id || '',
              senderName,
              tripPayload: tripSnap,
              status: row.status || 'pending',
              read: Boolean(row.is_read),
              createdAt: row.created_at || new Date().toISOString()
            }, isBackground && !row.is_read && row.status === 'pending');
          });
        }

        if (!isBackground) {
          for (const localTrip of state.trips) {
            if (canEditTrip(localTrip)) {
              await syncTripToSupabase(localTrip);
            }
          }
        }

        supabaseConnState.restOk = true;
        supabaseConnState.errorDetail = '';
        saveState();
        if (hasTripChanges) {
          renderActiveTab();
        }
      } catch (e) {
        if (!isBackground) {
          supabaseConnState.errorDetail = e.message || '동기화 조회 오류';
        }
      }
    }

    async function syncTripToSupabase(trip) {
      if (!trip) return;
      normalizeTripOwnership(trip);
      try {
        await sbRestFetch('tripic_trips?on_conflict=id', {
          method: 'POST',
          headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
          body: {
            id: trip.id,
            owner_id: trip.ownerId,
            member_ids: trip.memberIds,
            members: trip.members,
            title: trip.title,
            city: trip.city,
            start_date: trip.start,
            end_date: trip.end,
            people: trip.people,
            mode: trip.mode,
            days: trip.days,
            last_editor: trip.lastEditor || getCurrentActorLabel(),
            updated_at: trip.updatedAt || new Date().toISOString()
          }
        });
        supabaseConnState.restOk = true;
        supabaseConnState.errorDetail = '';
      } catch (e) {}
    }

    async function commitTripEdit(trip) {
      if (!trip) return;
      normalizeTripOwnership(trip);
      trip.updatedAt = new Date().toISOString();
      trip.lastEditor = getCurrentActorLabel();
      saveState();

      if (activeTripCollabChannel && activeCollabTripId === trip.id) {
        try {
          activeTripCollabChannel.send({
            type: 'broadcast',
            event: 'trip_patch',
            payload: {
              tripId: trip.id,
              editorId: getCurrentActorId(),
              editorLabel: trip.lastEditor,
              title: trip.title,
              days: trip.days,
              members: trip.members,
              memberIds: trip.memberIds,
              updatedAt: trip.updatedAt
            }
          });
        } catch (e) {}
      }

      await syncTripToSupabase(trip);
    }

    /* Notification Center & Invite Popups */
    function updateBellBadge() {
      const badge = document.getElementById('bellBadge');
      if (!badge) return;
      const unreadCount = (state.notifications || []).filter(n => !n.read).length;
      if (unreadCount > 0) {
        badge.textContent = unreadCount > 99 ? '99+' : String(unreadCount);
        badge.classList.add('show');
      } else {
        badge.textContent = '0';
        badge.classList.remove('show');
      }
    }

    function showInAppAlertBanner(title, desc, notifId) {
      const banner = document.getElementById('inAppAlertBanner');
      const titleEl = document.getElementById('alertBannerTitle');
      const descEl = document.getElementById('alertBannerDesc');
      if (!banner || !titleEl || !descEl) return;

      activeBannerNotifId = notifId || null;
      titleEl.textContent = title;
      descEl.textContent = desc;
      banner.classList.add('show');

      clearTimeout(window._alertBannerTimer);
      window._alertBannerTimer = setTimeout(() => {
        banner.classList.remove('show');
      }, 4200);
    }

    function handleAlertBannerClick() {
      const banner = document.getElementById('inAppAlertBanner');
      if (banner) banner.classList.remove('show');
      if (activeBannerNotifId) {
        const target = state.notifications.find(n => n.id === activeBannerNotifId);
        if (target && target.type === 'invite' && target.status === 'pending') {
          openInvitePopupModal(target.id);
          return;
        }
      }
      openNotificationDrawer();
    }

    function ingestIncomingNotification(notif, showAlertPopup) {
      if (!Array.isArray(state.notifications)) state.notifications = [];
      const exists = state.notifications.some(n => n.id === notif.id);
      if (exists) return;

      state.notifications.unshift({
        id: notif.id || ('notif_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)),
        type: notif.type || 'info',
        title: notif.title || '알림',
        message: notif.message || '',
        senderId: notif.senderId || '',
        senderName: notif.senderName || '',
        senderCode: notif.senderCode || '',
        tripPayload: notif.tripPayload || null,
        status: notif.status || 'done',
        read: Boolean(notif.read),
        createdAt: notif.createdAt || new Date().toISOString()
      });

      if (state.notifications.length > 40) {
        state.notifications = state.notifications.slice(0, 40);
      }

      saveState();

      if (showAlertPopup) {
        showInAppAlertBanner(notif.title, notif.message, notif.id);
        if (notif.type === 'invite' && notif.status === 'pending') {
          openInvitePopupModal(notif.id);
        }
      }
    }

    function formatNotifTime(iso) {
      if (!iso) return '방금 전';
      const diff = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
      if (diff < 60) return '방금 전';
      if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
      return iso.slice(5, 10);
    }

    function openNotificationDrawer() {
      const list = state.notifications || [];
      const unreadCount = list.filter(n => !n.read).length;

      const itemsHtml = list.length === 0
        ? `
          <div style="text-align:center;padding:32px 14px;color:var(--muted);">

    async function respondToInvite(notifId, accept) {
      const notif = (state.notifications || []).find(n => n.id === notifId);
      if (!notif) return;

      notif.read = true;
      notif.status = accept ? 'accepted' : 'declined';

      try {
        await sbRestFetch(`tripic_notifications?id=eq.${encodeURIComponent(notifId)}`, {
          method: 'PATCH',
          headers: { 'Prefer': 'return=minimal' },
          body: { is_read: true, status: notif.status }
        });
      } catch (e) {}

      if (accept) {
        const me = getCurrentActorLabel();
        const myId = getCurrentActorId();
        const payload = notif.tripPayload;
        let targetTrip = payload && payload.id
          ? state.trips.find(t => t.id === payload.id)
          : null;

        if (targetTrip) {
          normalizeTripOwnership(targetTrip);
          if (!targetTrip.memberIds.includes(myId)) targetTrip.memberIds.push(myId);
          if (!targetTrip.members.includes(me)) targetTrip.members.push(me);
        } else {
          const baseTrip = payload && payload.days
            ? {
                ...payload,
                id: payload.id || ('trip_joined_' + Date.now()),
                ownerId: payload.ownerId || notif.senderId || 'owner_shared',
                memberIds: Array.from(new Set([...(payload.memberIds || []), payload.ownerId || notif.senderId || 'owner_shared', myId])),
                members: Array.from(new Set([...(payload.members || []), notif.senderName || '초대자', me]))
              }
            : {
                id: 'trip_joined_' + Date.now(),
                ownerId: notif.senderId || 'owner_shared',
                memberIds: Array.from(new Set([notif.senderId || 'owner_shared', myId])),
                title: `${notif.senderName || '동행자'}님과의 서울 힐링 여행`,
                city: '서울특별시',
                start: toIsoLocal(new Date().getFullYear(), new Date().getMonth(), new Date().getDate()),
                end: toIsoLocal(new Date().getFullYear(), new Date().getMonth(), new Date().getDate() + 1),
                people: '2명 (커플/친구)',
                mode: 'shared',
                members: [notif.senderName || '동행자', me],
                days: {
                  1: [
                    { id: 'inv_1', name: '성수동 카페거리', cat: '감성 카페', time: '11:00', duration: '1시간 30분', desc: '성수 연무장길 감성 카페 투어', address: '서울특별시 성동구 연무장길 35', lat: 37.5445, lon: 127.0560, memo: '' },
                    { id: 'inv_2', name: '서울숲', cat: '명소/산책', time: '14:00', duration: '2시간', desc: '도심 속 초록 산책 코스', address: '서울특별시 성동구 뚝섬로 273', lat: 37.5444, lon: 127.0374, memo: '' }
                  ],
                  2: [
                    { id: 'inv_3', name: '연남동 경의선숲길', cat: '명소/산책', time: '12:00', duration: '2시간', desc: '소품샵과 브런치 골목 산책', address: '서울특별시 마포구 양화로23길 22-7', lat: 37.5618, lon: 126.9255, memo: '' }
                  ]
                }
              };

          targetTrip = normalizeTripOwnership(baseTrip);
          state.trips.unshift(targetTrip);
        }

        state.activeTripId = targetTrip.id;
        state.activeDay = 1;
        await commitTripEdit(targetTrip);
        closeModal();
        switchTab('route');

    function handleCitySearchInput(rawVal) {
      const q = (rawVal || '').trim();
      const listEl = document.getElementById('cityAcList');
      const pillEl = document.getElementById('verifiedCityPill');
      if (!listEl) return;

      if (!q) {
        selectedVerifiedCity = null;
        if (pillEl) pillEl.classList.remove('show');
        listEl.classList.remove('open');
        listEl.innerHTML = '';
        return;
      }

      if (selectedVerifiedCity && selectedVerifiedCity.official !== q) {
        selectedVerifiedCity = null;
        if (pillEl) pillEl.classList.remove('show');
      }

      const tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
      const compactQ = q.replace(/\s+/g, '').toLowerCase();

      const localMatches = OFFICIAL_REGIONS_DB.filter(r => {
        const hay = `${r.official} ${r.core} ${r.keywords}`.toLowerCase();
        const hayCompact = hay.replace(/\s+/g, '');
        return tokens.every(tk => hay.includes(tk)) || hayCompact.includes(compactQ);
      }).sort((a, b) => {
        const aStarts = a.official.toLowerCase().startsWith(q.toLowerCase()) || a.core.toLowerCase() === q.toLowerCase();
        const bStarts = b.official.toLowerCase().startsWith(q.toLowerCase()) || b.core.toLowerCase() === q.toLowerCase();
        if (aStarts !== bStarts) return aStarts ? -1 : 1;
        return a.official.length - b.official.length;
      });

      cityAcResults = [...localMatches];
      renderCityAcDropdown(cityAcResults, true);

      clearTimeout(cityDebounceTimer);
      if (cityFetchController) {
        cityFetchController.abort();
      }

      cityDebounceTimer = setTimeout(async () => {
        try {
          cityFetchController = new AbortController();
          const signal = cityFetchController.signal;
          const nomUrl = `https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&accept-language=ko&limit=8&q=${encodeURIComponent(q)}`;

          const res = await fetch(nomUrl, { signal, headers: { 'Accept': 'application/json' } });
          const data = res.ok ? await res.json() : [];
          const remoteRegions = (Array.isArray(data) ? data : [])
            .filter(item => {
              const cls = item.class || item.category || '';
              const tp = item.type || '';
              return cls === 'boundary' || cls === 'place' || ['administrative', 'city', 'town', 'village', 'county', 'state', 'province', 'district', 'suburb'].includes(tp);
            })
            .map(item => {
              const a = item.address || {};
              const parts = [
                a.country && a.country !== '대한민국' ? a.country : '',
                a.province || a.state,
                a.city && a.city !== (a.province || a.state) ? a.city : '',
                a.borough || a.county || a.district
              ].filter(Boolean);
              const deduped = [];
              parts.forEach(p => { if (!deduped.includes(p)) deduped.push(p); });
              const official = deduped.join(' ') || (item.name && item.name.trim()) || item.display_name.split(',')[0].trim();
              return {
                official,
                core: getCityCoreKeyword(official),
                badge: '행정구역',
                desc: item.display_name || official
              };
            })
            .filter(r => r.official && r.official.length >= 2);

          const merged = [...localMatches];
          remoteRegions.forEach(rm => {
            const norm = rm.official.replace(/\s+/g, '').toLowerCase();
            const exists = merged.some(m => m.official.replace(/\s+/g, '').toLowerCase() === norm);
            if (!exists) merged.push(rm);
          });

          cityAcResults = merged.slice(0, 10);
          renderCityAcDropdown(cityAcResults, false);
        } catch (err) {
          if (err.name !== 'AbortError') {
            renderCityAcDropdown(cityAcResults, false);
          }
        }
      }, 220);
    }

    function createTrip() {
      const rawCity = (document.getElementById('inpCity').value || '').trim();
      const matchedDbRegion = OFFICIAL_REGIONS_DB.find(
        r => r.official.replace(/\s+/g, '') === rawCity.replace(/\s+/g, '')
      );

      if (!selectedVerifiedCity && matchedDbRegion) {
        selectedVerifiedCity = matchedDbRegion;
      }

      if (!rawCity || !selectedVerifiedCity) {
        showToast('연관 검색 목록에서 실제 여행지를 선택해 주세요.');
        const cityInp = document.getElementById('inpCity');
        if (cityInp) {
          cityInp.focus();
          handleCitySearchInput(rawCity);
        }
        return;
      }

      const city = selectedVerifiedCity.official;
      const coreCity = selectedVerifiedCity.core || getCityCoreKeyword(city);
      const titleInput = (document.getElementById('inpTitle').value || '').trim();
      const start = document.getElementById('inpStart').value || new Date().toISOString().slice(0, 10);
      const end = document.getElementById('inpEnd').value || start;
      const people = document.getElementById('inpPeople').value;

      const d1 = new Date(start);
      const d2 = new Date(end);
      let dayCount = Math.max(1, Math.min(10, Math.round((d2 - d1) / 86400000) + 1));
      if (isNaN(dayCount)) dayCount = 2;

      const days = {};
      const pool = SPOT_POOL[coreCity] || SPOT_POOL[city] || SPOT_POOL['기본'];

      for (let d = 1; d <= dayCount; d++) {
        if (state.createMode === 'manual') {
          days[d] = [];
        } else {
          const picks = [];
          for (let i = 0; i < 3; i++) {
            const item = pool[((d - 1) * 3 + i) % pool.length];
            picks.push({
              id: 'sp_' + Date.now() + '_' + d + '_' + i,
              name: coreCity !== '제주' && coreCity !== '도쿄' ? `${coreCity} ${item.name}` : item.name,
              cat: item.cat,
              time: ['10:00', '13:30', '17:30'][i],

    function inferPlaceCategory(name, osmClass, osmType) {
      const text = `${name} ${osmClass || ''} ${osmType || ''}`.toLowerCase();
      if (/터미널|버스|역|공항|정류장|환승|station|bus_station|terminal|subway|rail|bus_stop|aerodrome/.test(text)) {
        return '교통/역';
      }
      if (/카페|커피|스타벅스|투썸|이디야|메가|컴포즈|베이커리|디저트|cafe|coffee|bakery/.test(text)) {
        return '감성 카페';
      }
      if (/서브웨이|식당|맛집|국수|고기|초밥|라멘|피자|버거|치킨|분식|시장|restaurant|fast_food|food/.test(text)) {
        return '맛집 탐방';
      }
      if (/몰|백화점|아울렛|마트|소품|쇼핑|mall|supermarket|shop/.test(text)) {
        return '쇼핑/소품샵';
      }
      if (/호텔|리조트|펜션|게스트하우스|숙소|hotel|motel|hostel/.test(text)) {
        return '숙소/휴식';
      }
      return '명소/산책';
    }

    function formatNominatimAddress(item) {
      const a = item.address || {};
      const parts = [
        a.province || a.state || a.city,
        a.city && a.province ? a.city : '',
        a.borough || a.county || a.district || a.suburb,
        a.quarter || a.neighbourhood || a.village || a.town,
        a.road,
        a.house_number
      ].filter(Boolean);

      const deduped = [];
      parts.forEach(p => {
        if (!deduped.includes(p)) deduped.push(p);
      });
      return deduped.length ? deduped.join(' ') : (item.display_name || '');
    }

    function formatPhotonAddress(props) {
      const parts = [
        props.state,
        props.city,
        props.county || props.district,
        props.suburb || props.locality,
        props.street,
        props.housenumber
      ].filter(Boolean);

      const deduped = [];
      parts.forEach(p => {
        if (!deduped.includes(p)) deduped.push(p);
      });
      return deduped.join(' ');
    }

    function isDestinationMatch(item, activeCity) {
      if (!activeCity) return false;
      const fullCity = activeCity.trim().toLowerCase();
      const coreCity = getCityCoreKeyword(activeCity).toLowerCase();
      if (!fullCity && !coreCity) return false;
      const hay = `${item.name || ''} ${item.address || ''} ${item.keywords || ''}`.toLowerCase();
      if (fullCity && hay.includes(fullCity)) return true;
      if (coreCity && hay.includes(coreCity)) return true;
      if (coreCity === '제주' && hay.includes('서귀포')) return true;
      return false;
    }

    function sortByDestinationPriority(items, activeCity) {
      return items
        .map((item, idx) => ({
          ...item,
          isCityMatch: isDestinationMatch(item, activeCity),
          _origIdx: idx
        }))
        .sort((a, b) => {
          if (a.isCityMatch !== b.isCityMatch) {
            return a.isCityMatch ? -1 : 1;
          }
          return a._origIdx - b._origIdx;
        });
    }

    function handlePlaceSearchInput(rawVal) {
      const q = (rawVal || '').trim();
      const listEl = document.getElementById('placeAcList');
      if (!listEl) return;

      if (!q) {
        listEl.classList.remove('open');
        listEl.innerHTML = '';
        return;
      }

      if (selectedPlaceMeta && selectedPlaceMeta.name !== q) {
        selectedPlaceMeta = null;
      }

      const trip = getActiveTrip();
      const activeCity = trip && trip.city ? trip.city.trim() : '';
      const coreCity = getCityCoreKeyword(activeCity);
      const tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
      const compactQuery = q.replace(/\s+/g, '');

      const localMatches = LOCAL_PLACES_DB.filter(item => {
        const hay = `${item.name} ${item.address} ${item.cat} ${item.keywords || ''}`.toLowerCase();
        const hayCompact = hay.replace(/\s+/g, '');
        return tokens.every(tk => hay.includes(tk)) || hayCompact.includes(compactQuery.toLowerCase());
      });

      acResults = sortByDestinationPriority(localMatches, activeCity);
      renderAcDropdown(acResults, true, activeCity);

      clearTimeout(acDebounceTimer);
      if (acFetchController) {
        acFetchController.abort();
      }

      acDebounceTimer = setTimeout(async () => {
        try {
          acFetchController = new AbortController();
          const signal = acFetchController.signal;

          const queryVariants = [];
          const scopeCity = coreCity || activeCity;
          if (scopeCity && !q.toLowerCase().includes(scopeCity.toLowerCase())) {
            queryVariants.push(`${scopeCity} ${q}`);
          }
          queryVariants.push(q);
          if (compactQuery && compactQuery !== q) {
            queryVariants.push(compactQuery);
          }

          const fetchPromises = [];

          queryVariants.forEach(variant => {
            const nomUrl = `https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&countrycodes=kr&accept-language=ko&limit=10&q=${encodeURIComponent(variant)}`;
            fetchPromises.push(
              fetch(nomUrl, { signal, headers: { 'Accept': 'application/json' } })
                .then(r => (r.ok ? r.json() : []))
                .then(data => (Array.isArray(data) ? data : []).map(item => {
                  const addr = formatNominatimAddress(item);
                  const primaryName = (item.name && item.name.trim())
                    ? item.name.trim()
                    : (addr || item.display_name.split(',')[0].trim());
                  return {
                    name: primaryName,
                    cat: inferPlaceCategory(primaryName, item.category || item.class, item.type),
                    address: addr || item.display_name,
                    lat: parseFloat(item.lat),
                    lon: parseFloat(item.lon)
                  };
                }))
                .catch(() => [])
            );
          });

          queryVariants.forEach(variant => {
            const photonUrl = `https://photon.komoot.io/api/?q=${encodeURIComponent(variant)}&limit=10`;
            fetchPromises.push(
              fetch(photonUrl, { signal, headers: { 'Accept': 'application/json' } })
                .then(r => (r.ok ? r.json() : { features: [] }))
                .then(geo => {
                  const feats = Array.isArray(geo.features) ? geo.features : [];
                  return feats
                    .filter(f => {
                      const p = f.properties || {};
                      return p.countrycode === 'KR' || /[가-힣]/.test(`${p.name || ''} ${p.city || ''} ${p.state || ''}`);
                    })
                    .map(f => {
                      const p = f.properties || {};
                      const coords = (f.geometry && Array.isArray(f.geometry.coordinates)) ? f.geometry.coordinates : [null, null];
                      const addr = formatPhotonAddress(p);
                      const primaryName = (p.name && p.name.trim()) ? p.name.trim() : (addr || q);
                      return {
                        name: primaryName,
                        cat: inferPlaceCategory(primaryName, p.osm_key, p.osm_value),
                        address: addr || primaryName,
                        lat: typeof coords[1] === 'number' ? coords[1] : null,
                        lon: typeof coords[0] === 'number' ? coords[0] : null
                      };
                    });
                })
                .catch(() => [])
            );
          });

          const batches = await Promise.all(fetchPromises);
          const remoteAll = batches.flat();

          const filteredRemote = remoteAll.filter(rm => {
            if (!rm.name) return false;
            const hay = `${rm.name} ${rm.address}`.toLowerCase();
            const hayCompact = hay.replace(/\s+/g, '');
            return tokens.every(tk => hay.includes(tk)) || hayCompact.includes(compactQuery.toLowerCase());
          });

          const merged = [...localMatches];
          filteredRemote.forEach(rm => {
            const normName = rm.name.replace(/\s+/g, '').toLowerCase();
            const isDup = merged.some(m => {
              const mNorm = m.name.replace(/\s+/g, '').toLowerCase();
              const closeCoord = (typeof m.lat === 'number' && typeof rm.lat === 'number')
                ? (Math.abs(m.lat - rm.lat) < 0.0015 && Math.abs(m.lon - rm.lon) < 0.0015)
                : false;
              return mNorm === normName || (closeCoord && mNorm.includes(normName));
            });
            if (!isDup) merged.push(rm);
          });

          acResults = sortByDestinationPriority(merged, activeCity).slice(0, 12);
          renderAcDropdown(acResults, false, activeCity);
        } catch (err) {
          if (err.name !== 'AbortError') {
            renderAcDropdown(acResults, false, activeCity);
          }
        }
      }, 240);
    }

    function renderAcDropdown(items, isSearching, activeCity) {
      const listEl = document.getElementById('placeAcList');
      if (!listEl) return;

      if (!items.length && !isSearching) {
        listEl.innerHTML = `
          <div class="ac-status">
            <span>검색 결과가 없습니다. 입력한 이름 그대로 추가할 수 있어요.</span>
          </div>
        `;
        listEl.classList.add('open');
        return;
      }

      const cityLabel = activeCity ? ` · ${escapeHtml(activeCity)} 우선` : '';
      const statusBar = isSearching

    function drawRouteCanvas(stops, city) {
      setTimeout(() => {
        const canvas = document.getElementById('routeCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;
        ctx.clearRect(0, 0, W, H);

        ctx.fillStyle = '#E6EFE8';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#D7E7DC';
        ctx.beginPath();
        ctx.arc(W * 0.85, H * 0.2, 160, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(W * 0.14, H * 0.85, 130, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.65)';
        ctx.lineWidth = 4;
        for (let x = 90; x < W; x += 140) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x + 30, H);
          ctx.stroke();
        }
        for (let y = 80; y < H; y += 120) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y - 20);
          ctx.stroke();
        }

        ctx.fillStyle = 'rgba(49, 92, 76, 0.14)';
        ctx.font = '800 32px sans-serif';
        ctx.fillText(city + ' MAP', 26, 46);

        if (!stops.length) {
          ctx.fillStyle = '#315C4C';
          ctx.font = '700 21px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('장소를 추가하면 이동 경로가 지도에 표시됩니다', W / 2, H / 2);
          ctx.textAlign = 'left';
          return;
        }

        const geoStops = stops.filter(s => typeof s.lat === 'number' && typeof s.lon === 'number' && !isNaN(s.lat) && !isNaN(s.lon));
        const useGeo = geoStops.length >= 2;
        let minLat = 0, maxLat = 0, minLon = 0, maxLon = 0;

        if (useGeo) {
          minLat = Math.min(...geoStops.map(s => s.lat));
          maxLat = Math.max(...geoStops.map(s => s.lat));
          minLon = Math.min(...geoStops.map(s => s.lon));
          maxLon = Math.max(...geoStops.map(s => s.lon));
        }

        const pts = stops.map((s, i) => {
          if (useGeo && typeof s.lat === 'number' && typeof s.lon === 'number') {
            const lonSpan = maxLon - minLon || 0.01;
            const latSpan = maxLat - minLat || 0.01;
            const nx = (s.lon - minLon) / lonSpan;
            const ny = 1 - (s.lat - minLat) / latSpan;
            return {
              x: 130 + nx * (W - 260),
              y: 95 + ny * (H - 190)
            };
          }
          const t = stops.length === 1 ? 0.5 : i / (stops.length - 1);
          const x = 110 + t * (W - 220);
          const y = H * 0.5 + Math.sin(i * 1.45) * 85;
          return { x, y };
        });

        ctx.save();
        ctx.strokeStyle = '#315C4C';
        ctx.lineWidth = 6;
        ctx.setLineDash([12, 10]);
        ctx.beginPath();
        pts.forEach((p, i) => (i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)));
        ctx.stroke();
        ctx.restore();

        pts.forEach((p, i) => {
          ctx.fillStyle = i === pts.length - 1 ? '#00B86B' : '#315C4C';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = 4;
          ctx.stroke();

          ctx.fillStyle = '#FFFFFF';
          ctx.font = '800 17px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(String(i + 1), p.x, p.y + 6);

          const label = stops[i].name.length > 11 ? stops[i].name.slice(0, 11) + '…' : stops[i].name;
          ctx.font = '700 15px sans-serif';
          const tw = ctx.measureText(label).width + 22;
          const ly = p.y > H * 0.55 ? p.y - 48 : p.y + 28;
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.roundRect(p.x - tw / 2, ly, tw, 28, 9);
          ctx.fill();
          ctx.fillStyle = '#1E2421';
          ctx.fillText(label, p.x, ly + 19);
        });
        ctx.textAlign = 'left';
      }, 20);
    }
