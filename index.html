    async function inviteByCode() {
      const code = (document.getElementById('inviteCodeInp').value || '').trim().toUpperCase();
      if (code.length !== 4) {
        showToast('4자리 영문/숫자 코드를 입력해 주세요.');
        return;
      }
      if (code === getMyCode()) {
        showToast('본인의 초대 코드는 입력할 수 없습니다.');
        return;
      }

      const trip = getActiveTrip();
      if (!ensureCanEdit(trip)) return;
      const senderId = getCurrentActorId();
      const senderName = getCurrentActorLabel();
      let found = state.users.find(u => u.code === code);

      if (!found) {
        try {
          const rows = await sbRestFetch(`tripic_users?select=user_id,nickname,code&code=eq.${encodeURIComponent(code)}&limit=1`);
          if (Array.isArray(rows) && rows[0]) {
            found = { userId: rows[0].user_id, nickname: rows[0].nickname, code: rows[0].code };
          }
        } catch (e) {}
      }

      const label = found ? `${found.nickname}(${code})` : `동행자(${code})`;
      const targetUserId = found ? found.userId : null;

      await syncTripToSupabase(trip);

      let sentRemote = false;
      try {
        await sbRestFetch('tripic_notifications', {
          method: 'POST',
          headers: { 'Prefer': 'return=minimal' },
          body: {
            id: 'notif_' + Date.now() + '_' + code,
            to_user_id: targetUserId,
            to_code: code,
            from_user_id: senderId,
            from_name: senderName,
            trip_id: trip.id,
            trip_title: trip.title,
            trip_snapshot: trip,
            status: 'pending',
            is_read: false
          }
        });
        sentRemote = true;
      } catch (e) {}

      if (!sentRemote && found && found.userId) {
        try {
          const targetKey = getScopedStateKey(found.userId);
          const rawTarget = localStorage.getItem(targetKey);
          const targetData = rawTarget ? JSON.parse(rawTarget) : { trips: [], notifications: [] };
          if (!Array.isArray(targetData.notifications)) targetData.notifications = [];
          targetData.notifications.unshift({
            id: 'notif_local_' + Date.now() + '_' + code,
            type: 'invite',
            title: `${senderName}님의 여행 동행 초대`,
            message: `'${trip.title}' (${trip.city}) 일정에 함께 참여해 보세요.`,
            senderId,
            senderName,
            senderCode: getMyCode(),
            tripPayload: trip,
            status: 'pending',
            read: false,
            createdAt: new Date().toISOString()
          });
          localStorage.setItem(targetKey, JSON.stringify(targetData));
        } catch (e) {}
      }

      ingestIncomingNotification({
        id: 'notif_sent_' + Date.now(),
        type: 'info',
        title: `${label}님에게 초대 발송`,
        message: `'${trip.title}' 일정 동행 초대를 보냈습니다. 상대방이 수락하면 동시 편집이 활성화됩니다.`,
        read: false
      }, false);

      closeModal();
      renderActiveTab();
      showInAppAlertBanner(
        `${label}님 초대 완료`,
        `상대방이 초대를 수락하면 함께 실시간 편집할 수 있습니다.`
      );
    }

    async function joinTripByCode() {
      const code = (document.getElementById('joinCodeInp').value || '').trim().toUpperCase();
      if (code.length !== 4) {
        showToast('4자리 코드를 정확히 입력해 주세요.');
        return;
      }

      const myId = getCurrentActorId();
      const me = getCurrentActorLabel();

      try {
        const hostRows = await sbRestFetch(`tripic_users?select=user_id,nickname,code&code=eq.${encodeURIComponent(code)}&limit=1`);
        const hostUser = Array.isArray(hostRows) && hostRows[0] ? hostRows[0] : null;

        if (hostUser) {
          const hostTrips = await sbRestFetch(`tripic_trips?select=*&owner_id=eq.${encodeURIComponent(hostUser.user_id)}&order=updated_at.desc&limit=1`);
          if (Array.isArray(hostTrips) && hostTrips[0]) {
            const mapped = mapSupabaseTripRow(hostTrips[0]);
            if (!mapped.memberIds.includes(myId)) mapped.memberIds.push(myId);
            if (!mapped.members.includes(me)) mapped.members.push(me);
            const idx = state.trips.findIndex(t => t.id === mapped.id);
            if (idx === -1) state.trips.unshift(mapped);
            else state.trips[idx] = mapped;
            state.activeTripId = mapped.id;
            state.activeDay = 1;
            await commitTripEdit(mapped);
            closeModal();
            switchTab('route');
            showToast('동행 일정에 합류했습니다. 실시간 동시 편집이 활성화됩니다.');
            return;
          }
        }
      } catch (e) {}

      const hostId = 'host_' + code.toLowerCase();
      const sharedTrip = {
        id: 'trip_shared_' + Date.now(),
        ownerId: hostId,
        memberIds: [hostId, myId],
        title: `동행 코드(${code}) 공유 여행`,
        city: '제주특별자치도',
        start: new Date().toISOString().slice(0, 10),
        end: new Date(Date.now() + 86400000).toISOString().slice(0, 10),
        people: '2명 (커플/친구)',
        mode: 'shared',
        members: [`호스트(${code})`, me],
        days: {
          1: SPOT_POOL['제주'].slice(0, 3).map((s, i) => ({ ...s, id: 'sh_' + i, memo: '' })),
          2: SPOT_POOL['제주'].slice(3, 5).map((s, i) => ({ ...s, id: 'sh2_' + i, memo: '' }))
        },
        lastEditor: me,
        updatedAt: new Date().toISOString()
      };
      state.trips.unshift(sharedTrip);
      state.activeTripId = sharedTrip.id;
      state.activeDay = 1;
      saveState();
      closeModal();
      switchTab('route');
      showToast('동행 일정에 합류했습니다.');
    }

    function validateNickname() {
      const inp = document.getElementById('authNick');
      const err = document.getElementById('nickErr');
      if (!inp || !err) return true;
      const val = inp.value.trim();
      const hasJamo = /[ㄱ-ㅎㅏ-ㅣ]/.test(val);
      if (val.length === 0) {
        err.classList.remove('show');
        return false;
      }
      if (hasJamo) {
        err.textContent = '한글 초성이나 단독 모음(ㄱ~ㅎ, ㅏ~ㅣ)은 사용할 수 없습니다.';
        err.classList.add('show');
        return false;
      }
      if (val.length < 2) {
        err.textContent = '닉네임은 2글자 이상 입력해 주세요.';
        err.classList.add('show');
        return false;
      }
      err.classList.remove('show');
      return true;
    }

      const badgeText = supabaseConnState.restOk && supabaseConnState.realtimeOk
        ? '실시간 클라우드 연결됨'
        : (supabaseConnState.restOk ? '클라우드 동기화 활성' : '연결 점검 필요');

      const supabaseCardHtml = `
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;">
            <div style="display:flex;align-items:center;gap:6px;font-size:14.5px;font-weight:800;color:var(--text);">
              ${ICONS.cloud}
              <span>Supabase 클라우드 실시간 연동</span>
            </div>
            <span class="sb-status-badge ${sbConnected ? 'online' : 'local'}">
              ${badgeText}
            </span>
          </div>
          <p style="font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:10px;">
            고정된 Supabase 프로젝트와 자동 연결되어 회원정보, 개인 일정, 4자리 코드 초대 알림 및 동시 편집이 실시간으로 동기화됩니다.
          </p>
          ${!supabaseConnState.restOk && supabaseConnState.errorDetail ? `
            <div style="font-size:11.5px;color:var(--danger);background:#FFF6F6;border:1px solid #F6D6D6;border-radius:10px;padding:8px 10px;margin-bottom:10px;">
              진단: ${escapeHtml(supabaseConnState.errorDetail)}
            </div>
          ` : ''}
          <button type="button" class="btn btn-primary btn-sm" style="width:100%;" onclick="reconnectSupabaseNow()">지금 동기화</button>
        </div>
      `;

      const savedTripsHtml = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px;">
          <h3 style="font-size:16px;font-weight:800;">내 여행 보관함 (${state.trips.length})</h3>
          <div style="display:flex;gap:6px;">
            <button type="button" class="btn btn-outline btn-sm" onclick="openJoinModal()">코드 합류</button>
            <button type="button" class="btn btn-primary btn-sm" onclick="setCreateMode('manual'); switchTab('create')">+ 새 일정</button>
          </div>
        </div>
        ${state.trips.length === 0 ? `
          <div class="card" style="text-align:center;padding:24px 16px;color:var(--muted);font-size:13px;">
            저장된 여행 일정이 아직 없습니다.
          </div>
        ` : state.trips.map(t => {
          const editable = canEditTrip(t);
          return `
            <div class="saved-card ${t.id === state.activeTripId ? 'current' : ''}">
              ${t.id === state.activeTripId ? '<span class="badge-now">현재 보는 일정</span>' : ''}
              <div style="font-size:12px;color:var(--green);font-weight:700;">${escapeHtml(t.city)} · ${Object.keys(t.days).length}일 코스</div>
              <div style="font-size:16px;font-weight:800;margin:4px 0;">${escapeHtml(t.title)}</div>
              <div style="font-size:12.5px;color:var(--muted);margin-bottom:12px;">${escapeHtml(t.start)} ~ ${escapeHtml(t.end)} · 동행 ${t.members.length}명</div>
              <div style="display:flex;gap:7px;">
                <button type="button" class="btn btn-primary btn-sm" style="flex:1;" onclick="selectTrip('${t.id}'); switchTab('route')">일정 열기</button>
                ${editable ? `<button type="button" class="btn btn-sage btn-sm" onclick="openRenameModal('${t.id}')">이름 변경</button>` : ''}
                <button type="button" class="btn btn-danger btn-sm" onclick="confirmDeleteTrip('${t.id}')">${editable ? '삭제' : '목록 제거'}</button>
              </div>
            </div>
          `;
        }).join('')}
      `;

      if (state.currentUser) {
        const u = state.currentUser;
        el.innerHTML = `
          <div class="card">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
              <div style="width:48px;height:48px;border-radius:16px;background:var(--sage);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;">
                ${escapeHtml(u.nickname[0])}
              </div>
              <div>
                <div style="font-size:18px;font-weight:800;">${escapeHtml(u.nickname)}</div>
                <div style="font-size:12.5px;color:var(--muted);">아이디: ${escapeHtml(u.userId)}</div>
              </div>
            </div>

            <div class="code-box">
              <div style="font-size:12px;font-weight:700;color:var(--green);">내 전용 4자리 동행 초대 코드</div>
              <div class="code-val">${u.code}</div>
              <div style="display:flex;gap:8px;justify-content:center;margin-top:6px;">
                <button type="button" class="btn btn-primary btn-sm" onclick="copyText('${u.code}')">코드 복사하기</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="simulateIncomingInvite()">초대 알림 테스트</button>
              </div>
            </div>

            <div style="display:flex;flex-direction:column;gap:9px;margin-top:16px;">
              <button type="button" class="btn btn-outline" onclick="confirmLogout()">로그아웃</button>
              <button type="button" class="btn btn-danger" onclick="confirmDeleteAccount()">계정 탈퇴</button>
            </div>
          </div>
          ${savedTripsHtml}
          ${supabaseCardHtml}
        `;
        return;
      }

      el.innerHTML = `
        <div class="card">
          <div class="mode-switch">
            <button type="button" class="mode-btn ${authMode === 'login' ? 'active' : ''}" onclick="authMode='login'; renderAccountTab()">로그인</button>
            <button type="button" class="mode-btn ${authMode === 'signup' ? 'active' : ''}" onclick="authMode='signup'; renderAccountTab()">회원가입</button>
          </div>

          ${authMode === 'signup' ? `
            <div class="field">
              <label>닉네임 (2글자 이상, 한글 초성/단독 모음 불가)</label>
              <input class="input" id="authNick" placeholder="예: 트립러버" oninput="validateNickname()" />
              <div class="error-text" id="nickErr"></div>
            </div>
          ` : ''}

          <div class="field">
            <label>아이디</label>
            <input class="input" id="authId" placeholder="사용할 아이디 입력 (이메일 불필요)" />
          </div>

          <div class="field">
            <label>비밀번호</label>
            <input class="input" type="password" id="authPw" placeholder="비밀번호 입력" />
          </div>

          <button type="button" class="btn btn-primary" onclick="submitAuth()">
            ${authMode === 'login' ? '아이디로 로그인' : '회원가입 완료'}
          </button>
        </div>

        <div class="card">
          <div style="font-size:13px;font-weight:700;color:var(--green);">비로그인 게스트 초대 코드</div>
          <div class="code-box" style="margin-bottom:0;">
            <div class="code-val">${state.guestCode}</div>
            <div style="display:flex;gap:8px;justify-content:center;">
              <button type="button" class="btn btn-sage btn-sm" onclick="copyText('${state.guestCode}')">코드 복사</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="simulateIncomingInvite()">초대 알림 테스트</button>
            </div>
          </div>
        </div>
        ${savedTripsHtml}
        ${supabaseCardHtml}
      `;
    }

    async function reconnectSupabaseNow() {
      showToast('Supabase 클라우드와 동기화 중...');
      await initSupabaseClient();
      renderAccountTab();
      if (supabaseConnState.restOk) {
        showToast('Supabase 클라우드 동기화가 완료되었습니다.');
      } else {
        showToast(supabaseConnState.errorDetail || 'Supabase 연결 상태를 확인해 주세요.');
      }
    }

    async function submitAuth() {
      const userId = (document.getElementById('authId').value || '').trim();
      const pw = (document.getElementById('authPw').value || '').trim();
      if (!userId || !pw) {
        showToast('아이디와 비밀번호를 모두 입력해 주세요.');
        return;
      }

      if (authMode === 'signup') {
        const nick = (document.getElementById('authNick').value || '').trim();
        if (!validateNickname() || nick.length < 2) {
          validateNickname();
          const err = document.getElementById('nickErr');
          if (err && !err.textContent) {
            err.textContent = '닉네임은 2글자 이상 입력해 주세요.';
            err.classList.add('show');
          }
          return;
        }
        if (state.users.some(u => u.userId === userId)) {
          showToast('이미 사용 중인 아이디입니다.');
          return;
        }

        const newUser = { userId, pw, nickname: nick, code: genCode() };

        try {
          const existingRows = await sbRestFetch(`tripic_users?select=user_id&user_id=eq.${encodeURIComponent(userId)}&limit=1`);
          if (Array.isArray(existingRows) && existingRows.length > 0) {
            showToast('Supabase에 이미 등록된 아이디입니다.');
            return;
          }
          await sbRestFetch('tripic_users', {
            method: 'POST',
            headers: { 'Prefer': 'return=minimal' },
            body: {
              user_id: newUser.userId,
              pw: newUser.pw,
              nickname: newUser.nickname,
              code: newUser.code
            }
          });
          supabaseConnState.restOk = true;
          supabaseConnState.errorDetail = '';
        } catch (e) {
          showToast(`클라우드 저장 참고(${e.message}) · 로컬 계정은 생성됩니다.`);
        }

        state.users.push(newUser);
        saveUsersRegistry(state.users);
        loadScopedAccountData(newUser);
        saveState();
        initSupabaseClient();
        renderAccountTab();
        ingestIncomingNotification({
          id: 'notif_welcome_' + Date.now(),
          type: 'info',
          title: `${nick}님, 트립픽 가입 완료`,
          message: `전용 4자리 초대 코드 [${newUser.code}]가 발급되었습니다. 내 개인 일정 공간이 준비되었습니다.`,
          read: false
        }, false);
        showToast(`${nick}님, 가입을 환영합니다.`);
      } else {
        let found = state.users.find(u => u.userId === userId && u.pw === pw);

        if (!found) {
          try {
            const rows = await sbRestFetch(`tripic_users?select=*&user_id=eq.${encodeURIComponent(userId)}&pw=eq.${encodeURIComponent(pw)}&limit=1`);
            if (Array.isArray(rows) && rows[0]) {
              found = {
                userId: rows[0].user_id,
                pw: rows[0].pw,
                nickname: rows[0].nickname,
                code: rows[0].code
              };
              state.users.push(found);
              saveUsersRegistry(state.users);
              supabaseConnState.restOk = true;
              supabaseConnState.errorDetail = '';
            }
          } catch (e) {}
        }

        if (!found) {
          showToast('아이디 또는 비밀번호가 일치하지 않습니다.');
          return;
        }
        loadScopedAccountData(found);
        saveState();
        initSupabaseClient();
        renderAccountTab();
        showToast(`${found.nickname}님의 개인 일정을 불러왔습니다.`);
      }
    }

    function confirmLogout() {
      openModal(`
        <div class="modal-title">로그아웃</div>
        <p style="font-size:14px;color:var(--muted);">현재 계정에서 로그아웃할까요?</p>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal()">취소</button>
          <button type="button" class="btn btn-primary" onclick="logout()">로그아웃</button>
        </div>
      `);
    }

    function logout() {
      loadScopedAccountData(null);
      saveState();
      initSupabaseClient();
      closeModal();
      renderAccountTab();
      showToast('로그아웃되었습니다.');
    }

    function confirmDeleteAccount() {
      openModal(`
        <div class="modal-title">계정 탈퇴 확인</div>
        <p style="font-size:14px;color:var(--muted);line-height:1.5;">
          탈퇴 시 계정 정보와 개인 초대 코드가 삭제됩니다. 정말 탈퇴하시겠습니까?
        </p>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal()">취소</button>
          <button type="button" class="btn btn-danger" onclick="deleteAccount()">계정 탈퇴</button>
        </div>
      `);
    }

    async function deleteAccount() {
      if (state.currentUser) {
        const delId = state.currentUser.userId;
        try {
          await sbRestFetch(`tripic_users?user_id=eq.${encodeURIComponent(delId)}`, {
            method: 'DELETE',
            headers: { 'Prefer': 'return=minimal' }
          });
        } catch (e) {}
        try {
          localStorage.removeItem(getScopedStateKey(delId));
        } catch (e) {}
        const updatedUsers = state.users.filter(u => u.userId !== delId);
        saveUsersRegistry(updatedUsers);
        loadScopedAccountData(null);
        state.users = updatedUsers;
      }
      saveState();
      initSupabaseClient();
      closeModal();
      renderAccountTab();
      showToast('계정 탈퇴가 완료되었습니다.');
    }

    function updateHeaderPill() {
      const pill = document.getElementById('headerUserPill');
      if (pill) {
        pill.textContent = state.currentUser ? state.currentUser.nickname : '게스트';
      }
    }

    function copyText(txt) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).catch(() => {
          fallbackCopyText(txt);
        });
      } else {
        fallbackCopyText(txt);
      }
      showToast(`초대 코드 [${txt}] 복사 완료.`);
    }

    function fallbackCopyText(txt) {
      try {
        const ta = document.createElement('textarea');
        ta.value = txt;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e) {}
    }

    function openModal(html) {
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('modalBackdrop').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[m]));
    }

    function initApp() {
      window._splashTimer = setTimeout(hideSplash, 1600);
      try {
        loadState();
        resetCreateFormInputs();
        updateHeaderPill();
        updateBellBadge();
        renderRouteTab();
        initSupabaseClient();
      } catch (err) {
        console.error('Initialization error:', err);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
    window.addEventListener('load', () => {
      setTimeout(hideSplash, 1600);
    });
  </script>
</body>
</html>
