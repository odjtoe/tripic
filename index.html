<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>TRIPIC · 트립픽</title>
<style>
  :root {
    --bg: #F8F7F3;
    --card: #FFFFFF;
    --green: #315C4C;
    --green-dark: #234438;
    --emerald: #00B86B;
    --sage: #E7EEE8;
    --sage-dark: #D3E0D6;
    --text: #1E2421;
    --muted: #6C7771;
    --border: #E3E6E1;
    --danger: #D9383A;
    --shadow: 0 6px 20px rgba(49, 92, 76, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: #ECEBE4;
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app-shell {
    width: 100%;
    max-width: 440px;
    background: var(--bg);
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 36px rgba(0,0,0,0.08);
    overflow-x: hidden;
  }

  /* Splash Screen */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.65s ease, visibility 0.65s ease;
  }
  #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .splash-svg { width: 290px; max-width: 78vw; height: auto; overflow: visible; }
  .sp-pin-start {
    opacity: 0;
    transform-origin: 48px 54px;
    animation: popIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
  }
  .sp-word {
    opacity: 0;
    animation: fadeSlide 0.55s ease 0.35s forwards;
  }
  .sp-route {
    stroke-dasharray: 280;
    stroke-dashoffset: 280;
    animation: drawLine 0.85s ease-out 0.65s forwards;
  }
  .sp-arrow {
    opacity: 0;
    animation: popIn 0.3s ease 1.35s forwards;
  }
  .sp-pin-end {
    opacity: 0;
    transform-origin: 272px 96px;
    animation: popIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) 1.45s forwards;
  }
  .sp-sub {
    margin-top: 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--green);
    letter-spacing: 0.04em;
    opacity: 0;
    animation: fadeSlide 0.5s ease 1.1s forwards;
  }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.4) translateY(8px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes fadeSlide {
    0% { opacity: 0; transform: translateY(6px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }

  /* Header */
  header {
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(248, 247, 243, 0.94);
    backdrop-filter: blur(10px);
    padding: 13px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .brand-title {
    font-weight: 900;
    font-size: 20px;
    letter-spacing: -0.03em;
    background: linear-gradient(90deg, #1E4D3B 0%, #00B86B 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand-badge {
    font-size: 11px;
    font-weight: 700;
    color: var(--green);
    background: var(--sage);
    padding: 3px 8px;
    border-radius: 99px;
  }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 15px;
  }
  .user-pill {
    font-size: 12px;
    font-weight: 700;
    color: var(--green);
    background: var(--sage);
    padding: 6px 11px;
    border-radius: 99px;
    cursor: pointer;
  }

  /* Main Container */
  main { flex: 1; padding: 16px 16px 96px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadeIn 0.22s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* Cards & Buttons */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }
  .btn {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .btn:active { transform: scale(0.985); }
  .btn-primary { background: var(--green); color: #fff; }
  .btn-primary:hover { background: var(--green-dark); }
  .btn-sage { background: var(--sage); color: var(--green); }
  .btn-outline { background: #fff; color: var(--green); border: 1.5px solid var(--green); }
  .btn-danger { background: #FDECEC; color: var(--danger); }
  .btn-sm { padding: 8px 12px; font-size: 13px; border-radius: 10px; width: auto; }

  /* Empty State */
  .empty-box {
    text-align: center;
    padding: 34px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow: var(--shadow);
    margin-top: 10px;
  }
  .empty-icon {
    width: 64px;
    height: 64px;
    border-radius: 20px;
    background: var(--sage);
    color: var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }
  .empty-title { font-size: 19px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
  .empty-desc { font-size: 13.5px; color: var(--muted); line-height: 1.55; margin-bottom: 22px; }
  .empty-btns { display: flex; flex-direction: column; gap: 10px; }

  /* Trip Switcher Bar */
  .switcher-wrap { margin-bottom: 12px; }
  .switcher-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 7px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .trip-chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .trip-chips::-webkit-scrollbar { display: none; }
  .trip-chip {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 700;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--muted);
    cursor: pointer;
  }
  .trip-chip.active {
    background: var(--green);
    color: #fff;
    border-color: var(--green);
  }

  /* Route Header & Controls */
  .route-banner {
    background: linear-gradient(135deg, #315C4C 0%, #24483B 100%);
    color: #fff;
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .route-banner-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .route-city { font-size: 12px; font-weight: 700; opacity: 0.85; margin-bottom: 4px; }
  .route-name { font-size: 20px; font-weight: 800; line-height: 1.25; }
  .route-dates { font-size: 12.5px; opacity: 0.85; margin-top: 6px; }
  .collab-bar {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.16);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .member-avatars { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .member-tag {
    background: rgba(255,255,255,0.16);
    padding: 4px 10px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 600;
  }
  .invite-mini-btn {
    background: #fff;
    color: var(--green);
    border: none;
    border-radius: 99px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* Day Tabs & View Toggle */
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .day-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab {
    padding: 7px 13px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--muted);
    cursor: pointer;
    flex-shrink: 0;
  }
  .day-tab.active { background: var(--sage); color: var(--green); border-color: var(--green); }
  .view-toggle {
    display: flex;
    background: var(--sage);
    padding: 3px;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .view-btn {
    border: none;
    background: transparent;
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    color: var(--green);
    cursor: pointer;
  }
  .view-btn.active { background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

  /* Timeline Items */
  .hint-bar {
    font-size: 12px;
    color: var(--muted);
    background: var(--sage);
    padding: 8px 12px;
    border-radius: 10px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stop-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 10px;
    position: relative;
    user-select: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .stop-card.pressing { transform: scale(0.98); box-shadow: 0 0 0 2px var(--green); }
  .stop-top { display: flex; align-items: flex-start; gap: 11px; }
  .stop-num {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--green);
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .stop-info { flex: 1; min-width: 0; }
  .stop-cat { font-size: 11px; font-weight: 700; color: var(--green); margin-bottom: 2px; }
  .stop-title { font-size: 15.5px; font-weight: 800; color: var(--text); }
  .stop-meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .stop-memo-preview {
    margin-top: 8px;
    background: var(--bg);
    border-left: 3px solid var(--green);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--text);
  }
  .stop-actions {
    display: flex;
    gap: 6px;
    margin-top: 11px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .mini-act {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 9px;
    padding: 7px 6px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .mini-act.del { color: var(--danger); background: #FFF6F6; border-color: #F6D6D6; }

  /* Canvas Map */
  .map-box {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 12px;
    margin-bottom: 12px;
  }
  #routeCanvas {
    width: 100%;
    height: 290px;
    border-radius: 12px;
    background: #EEF4EF;
    display: block;
  }

  /* Forms */
  .mode-switch {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    background: var(--sage);
    padding: 5px;
    border-radius: 14px;
    margin-bottom: 16px;
  }
  .mode-btn {
    border: none;
    background: transparent;
    padding: 10px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 800;
    color: var(--green);
    cursor: pointer;
  }
  .mode-btn.active { background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
  .input, select, textarea {
    width: 100%;
    padding: 12px 13px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    background: #fff;
    color: var(--text);
    font-family: inherit;
  }
  .input:focus, select:focus, textarea:focus { outline: none; border-color: var(--green); }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tag-group { display: flex; flex-wrap: wrap; gap: 7px; }
  .choice-chip {
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .choice-chip.selected { background: var(--green); color: #fff; border-color: var(--green); }
  .error-text {
    color: var(--danger);
    font-size: 12px;
    font-weight: 700;
    margin-top: 5px;
    display: none;
  }
  .error-text.show { display: block; }

  /* Saved Trips List */
  .saved-card {
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .saved-card.current { border-color: var(--green); background: #FBFDFB; }
  .badge-now {
    display: inline-block;
    font-size: 11px;
    font-weight: 800;
    color: #fff;
    background: var(--green);
    padding: 3px 8px;
    border-radius: 6px;
    margin-bottom: 6px;
  }

  /* Account & Code Card */
  .code-box {
    background: var(--sage);
    border: 1.5px dashed var(--green);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    margin: 14px 0;
  }
  .code-val {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 0.22em;
    color: var(--green);
    margin: 6px 0;
  }

  /* Bottom Nav */
  nav.bottom-nav {
    position: fixed;
    bottom: 0;
    width: 100%;
    max-width: 440px;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 8px 4px 12px;
    z-index: 50;
  }
  .nav-item {
    border: none;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
  }
  .nav-item.active { color: var(--green); }
  .nav-ico {
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  /* Modals */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 28, 24, 0.5);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal-sheet {
    width: 100%;
    max-width: 440px;
    background: #fff;
    border-radius: 24px 24px 0 0;
    padding: 22px 18px 28px;
    max-height: 85vh;
    overflow-y: auto;
    animation: slideUp 0.2s ease;
  }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 12px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 84px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: #1E2421;
    color: #fff;
    padding: 10px 16px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: all 0.22s ease;
    z-index: 300;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- Splash Intro -->
<div id="splash">
  <svg class="splash-svg" viewBox="0 0 320 130" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="tripicGrad" x1="55" y1="65" x2="255" y2="65" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#14533C"/>
        <stop offset="55%" stop-color="#1E8E5A"/>
        <stop offset="100%" stop-color="#00C471"/>
      </linearGradient>
    </defs>
    <!-- Start Pin -->
    <g class="sp-pin-start">
      <ellipse cx="48" cy="54" rx="11" ry="4" stroke="#14533C" stroke-width="2.5"/>
      <path d="M48 16C39.2 16 32 23.1 32 31.8C32 42.6 48 53 48 53C48 53 64 42.6 64 31.8C64 23.1 56.8 16 48 16ZM48 37.5C44.7 37.5 42 34.8 42 31.5C42 28.2 44.7 25.5 48 25.5C51.3 25.5 54 28.2 54 31.5C54 34.8 51.3 37.5 48 37.5Z" fill="#14533C"/>
    </g>
    <!-- TRIPIC Wordmark -->
    <text class="sp-word" x="155" y="79" text-anchor="middle" fill="url(#tripicGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-weight="900" font-style="italic" font-size="47" letter-spacing="1.5">TRIPIC</text>
    <!-- Curved Dashed Route -->
    <path class="sp-route" d="M34 62 C 12 88, 66 114, 246 93" stroke="url(#tripicGrad)" stroke-width="4.2" stroke-linecap="round" stroke-dasharray="9 9"/>
    <path class="sp-arrow" d="M238 86 L 249 92.5 L 241 102" stroke="#00C471" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- End Pin -->
    <g class="sp-pin-end">
      <ellipse cx="272" cy="96" rx="10" ry="3.6" stroke="#00C471" stroke-width="2.4"/>
      <path d="M272 60C263.7 60 257 66.7 257 74.9C257 85 272 95 272 95C272 95 287 85 287 74.9C287 66.7 280.3 60 272 60ZM272 80.2C268.9 80.2 266.4 77.7 266.4 74.6C266.4 71.5 268.9 69 272 69C275.1 69 277.6 71.5 277.6 74.6C277.6 77.7 275.1 80.2 272 80.2Z" fill="#00C471"/>
    </g>
  </svg>
  <div class="sp-sub">나만의 여행을 콕 집다 · 트립픽</div>
</div>

<div class="app-shell">
  <header>
    <div class="brand" onclick="playSplash()">
      <svg width="28" height="24" viewBox="0 0 36 28" fill="none">
        <path d="M9 2C5.1 2 2 5.1 2 9C2 14.2 9 20 9 20C9 20 16 14.2 16 9C16 5.1 12.9 2 9 2ZM9 11.5C7.6 11.5 6.5 10.4 6.5 9C6.5 7.6 7.6 6.5 9 6.5C10.4 6.5 11.5 7.6 11.5 9C11.5 10.4 10.4 11.5 9 11.5Z" fill="#315C4C"/>
        <path d="M8 23C14 26 24 25 31 20" stroke="#00B86B" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 3"/>
        <circle cx="31" cy="14" r="4" fill="#00B86B"/>
      </svg>
      <span class="brand-title">TRIPIC</span>
      <span class="brand-badge">트립픽</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" title="로고 인트로 다시보기" onclick="playSplash()">&#8635;</button>
      <div class="user-pill" id="headerUserPill" onclick="switchTab('account')">게스트</div>
    </div>
  </header>

  <main>
    <!-- TAB 1: 내 루트 -->
    <section id="tab-route" class="tab-panel active"></section>

    <!-- TAB 2: 새 여행 -->
    <section id="tab-create" class="tab-panel">
      <div class="card">
        <div class="mode-switch">
          <button class="mode-btn active" id="modeManualBtn" onclick="setCreateMode('manual')">직접 일정 짜기</button>
          <button class="mode-btn" id="modeAiBtn" onclick="setCreateMode('ai')">AI 일정 추천</button>
        </div>

        <div class="field">
          <label>여행 제목 (비워두면 자동 설정)</label>
          <input class="input" id="inpTitle" placeholder="예: 우리끼리 봄 제주 힐링 여행" />
        </div>

        <div class="field">
          <label>여행지 (도시 / 지역)</label>
          <input class="input" id="inpCity" placeholder="예: 제주, 도쿄, 부산, 강릉" value="제주" />
        </div>

        <div class="row-2">
          <div class="field">
            <label>출발일</label>
            <input class="input" type="date" id="inpStart" />
          </div>
          <div class="field">
            <label>도착일</label>
            <input class="input" type="date" id="inpEnd" />
          </div>
        </div>

        <div class="field">
          <label>동행 인원</label>

<script>
const STORAGE_KEY = 'tripic_app_state_v1';

const ICONS = {

const SPOT_POOL = {

    { name: '랜디스도넛 애월점', cat: '감성 카페', time: '12:00', duration: '1시간', desc: '오션뷰 테라스와 수제 도넛이 인기인 카페' },
    { name: '협재해수욕장 & 비양도 뷰', cat: '자연/풍경', time: '14:00', duration: '2시간', desc: '하얀 모래사장과 얕고 투명한 바다 풍경' },
    { name: '올래국수 본점', cat: '맛집 탐방', time: '17:30', duration: '1시간', desc: '진한 육수의 제주 대표 고기국수 전문점' },
    { name: '동문재래시장 야시장', cat: '먹거리/쇼핑', time: '19:30', duration: '1시간 30분', desc: '흑돼지 강정과 딱새우회 등 다양한 로컬 야식' },
    { name: '성산일출봉 둘레길', cat: '자연/명소', time: '09:30', duration: '2시간', desc: '유네스코 세계자연유산 분화구와 해안 절경' },
    { name: '우도 서빈백사 & 땅콩아이스크림', cat: '섬 투어', time: '13:00', duration: '3시간', desc: '배 타고 15분 만에 만나는 산호 해변 드라이브' },
    { name: '월정리 해변 카페거리', cat: '감성 카페', time: '16:30', duration: '1시간 30분', desc: '통유리 너머 파도를 보며 쉬어가는 카페 거리' }
  ],
  '도쿄': [
    { name: '아사쿠사 센소지 & 나카미세', cat: '명소/산책', time: '09:30', duration: '2시간', desc: '도쿄의 전통 분위기를 느끼는 대표 사찰 거리' },
    { name: '우에노 아메요코 시장 점심', cat: '맛집 탐방', time: '12:00', duration: '1시간 30분', desc: '활기찬 재래시장 골목의 가성비 카이센동' },
    { name: '시부야 스카이 전망대', cat: '전망/야경', time: '16:30', duration: '2시간', desc: '도쿄 도심 360도 파노라마 뷰 루프탑 전망대' },
    { name: '오모테산도 & 하라주쿠 캣스트리트', cat: '쇼핑/카페', time: '14:00', duration: '2시간', desc: '감각적인 편집숍과 스페셜티 커피가 모인 거리' },
    { name: '신주쿠 오모이데요코초', cat: '로컬 맛집', time: '19:30', duration: '2시간', desc: '레트로 감성 골목에서 즐기는 야키토리 저녁' }
  ],
  '기본': [
    { name: '로컬 브런치 & 스페셜티 카페', cat: '감성 카페', time: '10:30', duration: '1시간 30분', desc: '여행의 첫 시작을 여는 여유로운 모닝 커피' },
    { name: '핵심 랜드마크 산책 코스', cat: '명소/산책', time: '12:30', duration: '2시간', desc: '대표 포토스팟과 주변 골목을 둘러보는 코스' },
    { name: '현지인 추천 시그니처 식당', cat: '맛집 탐방', time: '15:00', duration: '1시간 30분', desc: '지역 특색 메뉴를 맛볼 수 있는 인기 맛집' },
    { name: '노을 전망 포인트 & 야경 스팟', cat: '자연/야경', time: '18:00', duration: '2시간', desc: '해 질 녘 가장 아름다운 야경을 감상하는 장소' }
  ]
};

let state = {
  trips: [],
  activeTripId: null,
  activeDay: 1,
  viewMode: 'timeline',
  createMode: 'manual',
  currentUser: null,
  users: []
};

function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  for (let i = 0; i < 4; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state = { ...state, ...parsed };
    }
  } catch (e) {}
  if (!state.currentUser) {
    if (!state.guestCode) state.guestCode = genCode();
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function playSplash() {
  const sp = document.getElementById('splash');
  sp.classList.remove('hide');
  const svg = sp.querySelector('svg');
  const clone = svg.cloneNode(true);
  svg.parentNode.replaceChild(clone, svg);
  clearTimeout(window._splashTimer);
  window._splashTimer = setTimeout(() => sp.classList.add('hide'), 2150);
}

function switchTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add('active');
  if (tab === 'route') renderRouteTab();
  if (tab === 'trips') renderTripsTab();
  if (tab === 'account') renderAccountTab();
}

function setCreateMode(mode) {
  state.createMode = mode;
  document.getElementById('modeManualBtn').classList.toggle('active', mode === 'manual');
  document.getElementById('modeAiBtn').classList.toggle('active', mode === 'ai');
  document.getElementById('aiOnlyFields').style.display = mode === 'ai' ? 'block' : 'none';
  document.getElementById('submitTripBtn').textContent = mode === 'manual' ? '빈 일정표 시작하기' : 'AI 맞춤 여행 일정 생성하기';
}

function selectSingle(btn, groupId) {
  document.querySelectorAll(`#${groupId} .choice-chip`).forEach(c => c.classList.remove('selected'));
  btn.classList.add('selected');
}

function getActiveTrip() {
  return state.trips.find(t => t.id === state.activeTripId) || null;
}

function createTrip() {
  const city = (document.getElementById('inpCity').value || '').trim() || '제주';
  const titleInput = (document.getElementById('inpTitle').value || '').trim();
  const start = document.getElementById('inpStart').value || new Date().toISOString().slice(0, 10);
  const end = document.getElementById('inpEnd').value || start;
  const people = document.getElementById('inpPeople').value;

  const d1 = new Date(start);
  const d2 = new Date(end);
  let dayCount = Math.max(1, Math.min(10, Math.round((d2 - d1) / 86400000) + 1));
  if (isNaN(dayCount)) dayCount = 2;

  const days = {};
  const pool = SPOT_POOL[city] || SPOT_POOL['기본'];

  for (let d = 1; d <= dayCount; d++) {
    if (state.createMode === 'manual') {
      days[d] = [];
    } else {
      const picks = [];
      for (let i = 0; i < 3; i++) {
        const item = pool[((d - 1) * 3 + i) % pool.length];
        picks.push({
          id: 'sp_' + Date.now() + '_' + d + '_' + i,
          name: city !== '제주' && city !== '도쿄' ? `${city} ${item.name}` : item.name,
          cat: item.cat,
          time: ['10:00', '13:30', '17:30'][i],
          duration: item.duration,
          desc: item.desc,
          memo: ''
        });
      }
      days[d] = picks;
    }
  }

  const ownerName = state.currentUser ? state.currentUser.nickname : '나(게스트)';
  const newTrip = {
    id: 'trip_' + Date.now(),
    title: titleInput || `${city} ${dayCount === 1 ? '당일치기' : (dayCount - 1) + '박 ' + dayCount + '일'} 여행`,
    city,
    start,
    end,
    people,
    mode: state.createMode,
    members: [ownerName],
    days
  };

  state.trips.unshift(newTrip);
  state.activeTripId = newTrip.id;
  state.activeDay = 1;
  saveState();
  showToast(state.createMode === 'manual' ? '빈 일정표가 생성되었어요!' : 'AI 맞춤 일정이 생성되었어요!');
  switchTab('route');
}

function renderRouteTab() {
  const container = document.getElementById('tab-route');
  const trip = getActiveTrip();

  if (!trip) {
    container.innerHTML = `
      <div class="empty-box">
        <div class="empty-icon">${ICONS.pin}</div>
        <div class="empty-title">아직 계획된 여행 루트가 없어요</div>
        <div class="empty-desc">
          원하는 장소를 하나씩 직접 담거나,<br/>
          AI 추천으로 첫 여행 일정을 시작해 보세요.
        </div>
        <div class="empty-btns">
          <button class="btn btn-primary" onclick="setCreateMode('manual'); switchTab('create')">
            직접 내 여행 일정 만들기
          </button>
          <button class="btn btn-sage" onclick="setCreateMode('ai'); switchTab('create')">
            AI로 새 여행 일정 만들기
          </button>
          <button class="btn btn-outline" onclick="openJoinModal()">
            초대 코드로 동행 일정 합류
          </button>
        </div>
      </div>
    `;
    return;
  }

  const dayKeys = Object.keys(trip.days).map(Number).sort((a, b) => a - b);
  if (!dayKeys.includes(state.activeDay)) state.activeDay = dayKeys[0] || 1;
  const stops = trip.days[state.activeDay] || [];

  const switcherHtml = `
    <div class="switcher-wrap">
      <div class="switcher-label">
        <span>저장된 일정 ${state.trips.length}개</span>
        <span style="color:var(--green);cursor:pointer;" onclick="setCreateMode('manual'); switchTab('create')">+ 새 일정</span>
      </div>
      <div class="trip-chips">
        ${state.trips.map(t => `
          <button class="trip-chip ${t.id === trip.id ? 'active' : ''}" onclick="selectTrip('${t.id}')">
            ${escapeHtml(t.city)} · ${escapeHtml(t.title)}
          </button>
        `).join('')}
      </div>
    </div>
  `;

  const bannerHtml = `
    <div class="route-banner">
      <div class="route-banner-top">
        <div>
          <div class="route-city">${escapeHtml(trip.city)} · ${escapeHtml(trip.people)}</div>
          <div class="route-name">${escapeHtml(trip.title)}</div>
          <div class="route-dates">${escapeHtml(trip.start)} ~ ${escapeHtml(trip.end)}</div>
        </div>
      </div>
      <div class="collab-bar">
        <div class="member-avatars">
          ${trip.members.map(m => `<span class="member-tag">${ICONS.user} ${escapeHtml(m)}</span>`).join('')}
        </div>
        <button class="invite-mini-btn" onclick="openInviteModal()">+ 동행자 초대</button>
      </div>
    </div>
  `;

  const toolbarHtml = `
    <div class="toolbar">
      <div class="day-tabs">
        ${dayKeys.map(d => `
          <button class="day-tab ${d === state.activeDay ? 'active' : ''}" onclick="selectDay(${d})">DAY ${d}</button>
        `).join('')}
      </div>
      <div class="view-toggle">
        <button class="view-btn ${state.viewMode === 'timeline' ? 'active' : ''}" onclick="setViewMode('timeline')">타임라인</button>
        <button class="view-btn ${state.viewMode === 'map' ? 'active' : ''}" onclick="setViewMode('map')">경로지도</button>
      </div>
    </div>
  `;

  let bodyHtml = '';
  if (state.viewMode === 'map') {
    bodyHtml = `
      <div class="map-box">
        <canvas id="routeCanvas" width="760" height="520"></canvas>
        <div style="font-size:12px;color:var(--muted);margin-top:8px;text-align:center;">
          DAY ${state.activeDay} 동선 시각화 · 총 ${stops.length}개 경유지
        </div>
      </div>
    `;
  }

  if (stops.length === 0) {
    bodyHtml += `
      <div class="card" style="text-align:center;padding:28px 16px;">
        <div class="empty-icon" style="width:48px;height:48px;border-radius:14px;margin-bottom:10px;">${ICONS.pin}</div>
        <div style="font-weight:800;font-size:15px;margin-bottom:6px;">DAY ${state.activeDay} 일정이 비어 있어요</div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:16px;">가고 싶은 맛집, 카페, 명소를 직접 추가해 보세요.</div>
        <button class="btn btn-primary" onclick="openAddStopModal()">+ 장소 직접 추가하기</button>
      </div>
    `;
  } else {
    bodyHtml += `
      <div class="hint-bar">
        <span>카드를 1초 길게 누르면 맨 위/아래로 이동</span>
        <span>${stops.length}곳</span>
      </div>
      ${stops.map((s, idx) => `
        <div class="stop-card"
             onpointerdown="startPress(event, ${idx})"
             onpointerup="cancelPress()"
             onpointerleave="cancelPress()"
             onpointercancel="cancelPress()">
          <div class="stop-top">
            <div class="stop-num">${idx + 1}</div>
            <div class="stop-info">
              <div class="stop-cat">${escapeHtml(s.cat)} · ${escapeHtml(s.time)} (${escapeHtml(s.duration)})</div>
              <div class="stop-title">${escapeHtml(s.name)}</div>
              <div class="stop-meta">${escapeHtml(s.desc || '')}</div>
              ${s.memo ? `<div class="stop-memo-preview">${escapeHtml(s.memo)}</div>` : ''}
            </div>
          </div>
          <div class="stop-actions">
            <button class="mini-act" onclick="openDetailModal(${idx})">상세 · 메모</button>
            <button class="mini-act" onclick="replaceStop(${idx})">장소 교체</button>
            <button class="mini-act del" onclick="confirmDeleteStop(${idx})">삭제</button>
          </div>
        </div>
      `).join('')}
      <button class="btn btn-sage" style="margin-top:6px;" onclick="openAddStopModal()">+ DAY ${state.activeDay}에 장소 추가</button>
    `;
  }

  container.innerHTML = switcherHtml + bannerHtml + toolbarHtml + bodyHtml;
  if (state.viewMode === 'map') drawRouteCanvas(stops, trip.city);
}

function selectTrip(id) {
  state.activeTripId = id;
  state.activeDay = 1;
  saveState();
  renderRouteTab();
}

function selectDay(d) {
  state.activeDay = d;
  renderRouteTab();
}

function setViewMode(m) {
  state.viewMode = m;
  renderRouteTab();

/* Vector Route Map */
function drawRouteCanvas(stops, city) {
  setTimeout(() => {
    const canvas = document.getElementById('routeCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = '#E6EFE8';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#D7E7DC';
    ctx.beginPath();
    ctx.arc(W * 0.85, H * 0.2, 160, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(W * 0.14, H * 0.85, 130, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.65)';
    ctx.lineWidth = 4;
    for (let x = 90; x < W; x += 140) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 30, H); ctx.stroke();
    }
    for (let y = 80; y < H; y += 120) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y - 20); ctx.stroke();
    }

    ctx.fillStyle = 'rgba(49, 92, 76, 0.14)';
    ctx.font = '800 34px sans-serif';
    ctx.fillText(city + ' MAP', 26, 48);

    if (!stops.length) {
      ctx.fillStyle = '#315C4C';
      ctx.font = '700 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('장소를 추가하면 이동 경로가 지도에 표시됩니다', W / 2, H / 2);
      ctx.textAlign = 'left';
      return;
    }

    const pts = stops.map((_, i) => {
      const t = stops.length === 1 ? 0.5 : i / (stops.length - 1);
      const x = 110 + t * (W - 220);
      const y = H * 0.5 + Math.sin(i * 1.45) * 105;
      return { x, y };
    });

    ctx.save();
    ctx.strokeStyle = '#315C4C';
    ctx.lineWidth = 6;
    ctx.setLineDash([12, 10]);
    ctx.beginPath();
    pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.stroke();
    ctx.restore();

    pts.forEach((p, i) => {
      ctx.fillStyle = i === pts.length - 1 ? '#00B86B' : '#315C4C';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '800 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(String(i + 1), p.x, p.y + 6);

      const label = stops[i].name.length > 11 ? stops[i].name.slice(0, 11) + '…' : stops[i].name;
      ctx.font = '700 16px sans-serif';
      const tw = ctx.measureText(label).width + 24;
      const ly = p.y > H * 0.55 ? p.y - 52 : p.y + 32;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.roundRect(p.x - tw / 2, ly, tw, 30, 10);
      ctx.fill();
      ctx.fillStyle = '#1E2421';
      ctx.fillText(label, p.x, ly + 20);
    });
    ctx.textAlign = 'left';
  }, 20);
}

function validateNickname() {
  const inp = document.getElementById('authNick');
  const err = document.getElementById('nickErr');
  if (!inp || !err) return true;
  const val = inp.value.trim();
  const hasJamo = /[ㄱ-ㅎㅏ-ㅣ]/.test(val);
  if (val.length === 0) {
    err.classList.remove('show');
    return false;
  }
  if (hasJamo) {
    err.textContent = '한글 초성이나 단독 모음(ㄱ~ㅎ, ㅏ~ㅣ)은 사용할 수 없습니다.';
    err.classList.add('show');
    return false;
  }
  if (val.length < 2) {
    err.textContent = '닉네임은 2글자 이상 입력해 주세요.';
    err.classList.add('show');
    return false;
  }
  err.classList.remove('show');
  return true;
}

function submitAuth() {
  const userId = (document.getElementById('authId').value || '').trim();
  const pw = (document.getElementById('authPw').value || '').trim();
  if (!userId || !pw) { showToast('아이디와 비밀번호를 모두 입력해 주세요.'); return; }

  if (authMode === 'signup') {
    const nick = (document.getElementById('authNick').value || '').trim();
    if (!validateNickname() || nick.length < 2) {
      validateNickname();
      const err = document.getElementById('nickErr');
      if (err && !err.textContent) {
        err.textContent = '닉네임은 2글자 이상 입력해 주세요.';
        err.classList.add('show');
      }
      return;
    }
    if (state.users.some(u => u.userId === userId)) {
      showToast('이미 사용 중인 아이디입니다.');
      return;
    }
    const newUser = { userId, pw, nickname: nick, code: genCode() };
    state.users.push(newUser);
    state.currentUser = newUser;
    saveState();
    renderAccountTab();
    showToast(`${nick}님, 가입을 환영합니다.`);
  } else {
    const found = state.users.find(u => u.userId === userId && u.pw === pw);
    if (!found) {
      showToast('아이디 또는 비밀번호가 일치하지 않습니다.');
      return;
    }
    state.currentUser = found;
    saveState();
    renderAccountTab();
    showToast(`${found.nickname}님 환영합니다.`);
  }
}

function confirmLogout() {
  openModal(`
    <div class="modal-title">로그아웃</div>
    <p style="font-size:14px;color:var(--muted);">현재 계정에서 로그아웃할까요?</p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="logout()">로그아웃</button>
    </div>
  `);
}

function logout() {
  state.currentUser = null;
  saveState();
  closeModal();
  renderAccountTab();
  showToast('로그아웃되었습니다.');
}

function confirmDeleteAccount() {
  openModal(`
    <div class="modal-title">계정 탈퇴 확인</div>
    <p style="font-size:14px;color:var(--muted);line-height:1.5;">
      탈퇴 시 계정 정보와 개인 초대 코드가 삭제됩니다. 정말 탈퇴하시겠습니까?
    </p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">취소</button>
      <button class="btn btn-danger" onclick="deleteAccount()">계정 탈퇴</button>
    </div>
  `);
}

function deleteAccount() {
  if (state.currentUser) {
    state.users = state.users.filter(u => u.userId !== state.currentUser.userId);
    state.currentUser = null;
  }
  saveState();
  closeModal();
  renderAccountTab();
  showToast('계정 탈퇴가 완료되었습니다.');
}

function updateHeaderPill() {
  const pill = document.getElementById('headerUserPill');
  pill.textContent = state.currentUser ? state.currentUser.nickname : '게스트';
}

function copyText(txt) {
  if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
  showToast(`초대 코드 [${txt}] 복사 완료.`);
}

function openModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalBackdrop').classList.add('open');
}
function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('open');
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}

// Init
(function init() {
  loadState();
  const today = new Date().toISOString().slice(0, 10);
  const tomorrow = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
  document.getElementById('inpStart').value = today;
  document.getElementById('inpEnd').value = tomorrow;
  updateHeaderPill();
  renderRouteTab();
  window._splashTimer = setTimeout(() => {
    document.getElementById('splash').classList.add('hide');
  }, 2150);
})();
</script>
